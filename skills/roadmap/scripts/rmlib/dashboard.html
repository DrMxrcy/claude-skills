<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roadmap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230e1116'/%3E%3Crect x='3' y='4' width='10' height='2' rx='1' fill='%233fb950'/%3E%3Crect x='3' y='7' width='7' height='2' rx='1' fill='%23d29922'/%3E%3Crect x='3' y='10' width='4' height='2' rx='1' fill='%234b5563'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#0e1116; --line:#232a34; --fg:#e6edf3; --muted:#8b98a5;
    --bar:#242c38; --done:#3fb950; --active:#d29922; --blocked:#f85149;
    --todo:#4b5563; --accent:#58a6ff; --build:#39c5cf; --gate:#a371f7;
  }
  * { box-sizing:border-box; }
  /* #app sets display:flex, which outranks the UA rule for [hidden] — without
     this the Roadmap pane stays visible on every tab. */
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { position:sticky; top:0; z-index:5; background:var(--bg);
    padding:14px 24px 12px; border-bottom:1px solid var(--line); }
  .wrap { max-width:960px; margin:0 auto; }
  .hrow { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .ver { color:var(--accent); }
  header .overall { margin-left:auto; color:var(--muted); font-size:12px; }
  #stale { display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--done); margin-right:6px; vertical-align:middle;
    transition:background .3s; }
  #stale.off { background:var(--todo); }
  .hbar { height:4px; background:var(--bar); border-radius:2px; margin-top:10px;
    overflow:hidden; }
  .hbar > i { display:block; height:100%; width:0; background:var(--done);
    transition:width .3s; }
  .counts { margin-top:9px; color:var(--muted); font-size:12px;
    display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:6px; }
  .chip .cdot { width:8px; height:8px; border-radius:50%; background:var(--todo); }
  .chip .cdot.done { background:var(--done); }
  .chip .cdot.active { background:var(--active); }
  .chip .cdot.blocked { background:var(--blocked); }
  .ctrls { margin-left:auto; display:flex; gap:8px; align-items:center; }
  #search { background:var(--bar); border:1px solid var(--line); color:var(--fg);
    border-radius:6px; padding:4px 9px; font:inherit; font-size:12px; width:190px; }
  #search::placeholder { color:var(--muted); }
  #rootsel { background:var(--bar); border:1px solid var(--line); color:var(--fg);
    border-radius:6px; padding:3px 6px; font:inherit; font-size:12px; }
  .lnk { color:var(--muted); cursor:pointer; user-select:none; font-size:12px; }
  .lnk:hover { color:var(--fg); }
  main { max-width:960px; margin:0 auto; padding:18px 24px 60px; }
  #app { display:flex; flex-direction:column; gap:18px; }
  .ver-group { margin:0; }
  .ver-head { display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:6px 0; user-select:none; }
  .ver-head h2 { font-size:13px; margin:0; letter-spacing:.02em; }
  .ver-head .vpct { color:var(--muted); font-size:12px; margin-left:auto; }
  .ver-group.collapsed .items { display:none; }
  .chev { color:var(--muted); transition:transform .15s; }
  .ver-group.collapsed .chev { transform:rotate(-90deg); }
  .item-wrap { border-top:1px solid var(--line); }
  .item { display:grid; grid-template-columns:14px 1fr auto;
    gap:10px; align-items:start; padding:7px 0; cursor:pointer; }
  .item:hover { background:rgba(255,255,255,.02); }
  .icaret { color:var(--muted); flex:none; font-size:10px; width:10px;
    display:inline-block; }
  .steps { padding:2px 0 12px 26px; display:flex; flex-direction:column;
    gap:4px; }
  .steps .note { color:var(--muted); margin-bottom:4px; font-style:normal; }
  .step { display:flex; gap:8px; align-items:baseline; font-size:13px; }
  .step .box { flex:none; color:var(--todo); }
  .step .box.done { color:var(--done); }
  .step .stext.done { color:var(--muted); text-decoration:line-through; }
  .steps .file { color:var(--muted); font-size:11px; margin-top:6px; }
  .steps .muted { color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--todo);
    margin-top:5px; }
  .dot.done { background:var(--done); }
  .dot.active { background:var(--active); }
  .dot.blocked { background:var(--blocked); }
  .title { display:flex; align-items:baseline; gap:8px; min-width:0;
    flex-wrap:wrap; }
  .title .num { color:var(--muted); flex:none; font-variant-numeric:tabular-nums; }
  .title .t { white-space:normal; overflow-wrap:anywhere; flex:1 1 auto; }
  .badge { font-size:10px; color:var(--muted); border:1px solid var(--line);
    border-radius:4px; padding:1px 5px; flex:none; }
  .blockedby { font-size:11px; color:var(--blocked); flex:none; }
  .right { display:flex; align-items:center; gap:10px; }
  .bar { width:110px; height:6px; background:var(--bar); border-radius:3px;
    overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--done);
    transition:width .3s; }
  .frac { color:var(--muted); font-size:12px; min-width:38px; text-align:right; }
  .empty { color:var(--muted); padding:40px 0; text-align:center; }
  .tabs { display:flex; gap:4px; margin-top:10px; }
  .tab { color:var(--muted); font-size:12px; padding:4px 10px; cursor:pointer;
    border:1px solid transparent; border-radius:6px; user-select:none; }
  .tab:hover { color:var(--fg); }
  .tab.on { color:var(--fg); background:var(--bar); border-color:var(--line); }
  .tab .n { color:var(--muted); margin-left:6px; font-size:11px; }
  .idea { border-top:1px solid var(--line); padding:8px 0; display:flex;
    gap:10px; align-items:baseline; }
  .idea .bullet { color:var(--active); flex:none; }
  .idea .body { overflow-wrap:anywhere; }
  .srcfile { color:var(--muted); font-size:11px; padding:6px 0 2px; }
  .rel { border-top:1px solid var(--line); padding:12px 0; }
  .rel h3 { margin:0 0 6px; font-size:13px; }
  .rel h3 .date { color:var(--muted); font-weight:400; margin-left:8px;
    font-size:11px; }
  .rel .pill { font-size:10px; color:var(--muted); border:1px solid var(--line);
    border-radius:4px; padding:1px 5px; margin-left:8px; }
  .rel .blurb { color:var(--fg); }
  .rel .sec { margin-top:6px; }
  .rel .sec h4 { margin:0 0 3px; font-size:12px; color:var(--muted);
    font-weight:600; }
  .rel .sec div { padding-left:14px; }
  .rel .pending { color:var(--active); }
  /* ---- in-flight overlay (plan 30): one colour per lane group ---------- */
  .lg-done { --lc:var(--done); }
  .lg-gate { --lc:var(--gate); }
  .lg-review { --lc:var(--active); }
  .lg-hold { --lc:var(--blocked); }
  .lg-build { --lc:var(--build); }
  .lg-plan { --lc:var(--todo); }
  .dot[class*="lg-"], .chip .cdot[class*="lg-"] { background:var(--lc); }
  .lane { font-size:10px; border-radius:4px; padding:1px 6px; flex:none;
    color:var(--lc); border:1px solid var(--lc); white-space:nowrap;
    background:color-mix(in srgb, var(--lc) 14%, transparent); }
  .lane.lg-plan { color:var(--muted); }
  .verdict { font-size:10px; border-radius:4px; padding:1px 5px; flex:none;
    font-weight:600; border:1px solid currentColor; }
  .verdict.CONFIRMED { color:var(--done); }
  .verdict.PARTIAL { color:var(--active); }
  .verdict.REFUTED { color:var(--blocked); }
  .flight { grid-column:2 / 4; display:flex; gap:10px; flex-wrap:wrap;
    align-items:center; font-size:12px; color:var(--muted); margin-top:-2px; }
  .flight .bname { color:var(--fg); overflow-wrap:anywhere; }
  .flight .ahead { color:var(--build); font-variant-numeric:tabular-nums; }
  .flight .wt { border:1px dashed var(--line); border-radius:4px;
    padding:0 5px; font-size:11px; }
  .bar.inflight { background:repeating-linear-gradient(-45deg,
    color-mix(in srgb, var(--lc) 35%, transparent) 0 4px, var(--bar) 4px 8px); }
  .filters { display:flex; gap:10px; align-items:center; }
  .filters label { display:inline-flex; gap:5px; align-items:center;
    cursor:pointer; user-select:none; }
  .filters input[type=checkbox] { accent-color:var(--accent); margin:0; }
  #laneFilter { background:var(--bar); border:1px solid var(--line);
    color:var(--fg); border-radius:6px; padding:3px 6px; font:inherit;
    font-size:12px; }
  .commits { margin-top:8px; display:flex; flex-direction:column; gap:3px; }
  .commits h4, .claim h4 { margin:0 0 2px; font-size:12px; color:var(--muted);
    font-weight:600; }
  .commit { display:grid; grid-template-columns:auto auto 1fr; gap:10px;
    font-size:12px; align-items:baseline; }
  .commit .sha { color:var(--accent); }
  .commit .age { color:var(--muted); min-width:52px; }
  .commit .subj { overflow-wrap:anywhere; }
  .claim { margin-top:8px; font-size:12px; }
  .ob { display:grid; grid-template-columns:1fr auto auto auto; gap:12px;
    font-size:12px; padding:5px 0; border-top:1px solid var(--line);
    align-items:baseline; }
  .ob .bname { overflow-wrap:anywhere; }
  .ob .muted { color:var(--muted); }
  .ob .ahead { color:var(--build); }
  @media (max-width:640px) {
    header, main { padding-left:16px; padding-right:16px; }
    .ctrls { margin-left:0; flex-wrap:wrap; }
    .bar { width:60px; }
    .ob { grid-template-columns:1fr auto; }
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <h1><span id="stale" title="live"></span><span id="project">roadmap</span>
        <span class="ver" id="cver"></span></h1>
      <select id="rootsel" autocomplete="off" hidden></select>
      <span class="overall" id="overall"></span>
    </div>
    <div class="hbar"><i id="hbarfill"></i></div>
    <div class="counts" id="counts"></div>
    <div class="tabs" id="tabs"></div>
    <div class="counts" id="rmctrls">
      <div class="ctrls">
        <input id="search" type="search" autocomplete="off" placeholder="filter items, #id or branch…">
        <span class="filters">
          <label title="hide done items"><input type="checkbox" id="openOnly"> open only</label>
          <select id="laneFilter" title="show one lane"></select>
        </span>
        <span class="lnk" id="expandAll">expand all</span>
        <span class="lnk" id="collapseAll">collapse all</span>
      </div>
    </div>
  </div>
</header>
<main>
  <div id="app"><div class="empty">connecting…</div></div>
  <div id="ideas" hidden></div>
  <div id="changelog" hidden></div>
</main>
<script>
// All text goes in via textContent (attributes via properties) — never parsed
// as HTML, so branch names and commit subjects (untrusted) cannot inject.
const el = (tag,cls) => { const e=document.createElement(tag);
  if(cls) e.className=cls; return e; };
const txt = (tag,cls,s) => { const e=el(tag,cls); e.textContent=s; return e; };
// localStorage can be missing or throw (private window, blocked site data):
// every read/write goes through these and the page works without them.
const store = {
  get(k, fb){ try { const v = localStorage.getItem(k);
    return v == null ? fb : JSON.parse(v); } catch(_){ return fb; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(_){} },
};
// Lanes (plan 30): derived per item by the CLI; the dashboard only colours
// and filters them. Group -> one colour family.
const LANES = ["building","review","fixing","gate-ready","gating","blocked",
  "stale","active","planned","done"];
const LANE_GROUP = {done:"done", gating:"gate", "gate-ready":"gate",
  review:"review", fixing:"review", blocked:"hold", stale:"hold",
  building:"build", active:"build", planned:"plan"};
const laneOf = it => it.lane || (it.status === "done" || it.pct === 100
  ? "done" : (it.status || "planned"));
const lg = it => "lg-" + (LANE_GROUP[laneOf(it)] || "plan");
// Same predicate as the CLI's is_in_flight: not done, and a branch or claim.
const inFlight = it => laneOf(it) !== "done" && !!(it.branch || it.claim);
// Default: the current version is expanded, all others collapsed. `prefs` holds
// only the versions the user explicitly toggled, so it overrides the default and
// auto-advance still opens whatever the new current version is.
const prefs = store.get("rm-prefs", {}) || {};
const savePrefs = () => store.set("rm-prefs", prefs);
const isOpen = (v,cur) => (v in prefs) ? prefs[v] : (v === cur);
// Items the user drilled into (checklist expanded). Persisted across reloads.
const openItems = new Set(Array.isArray(store.get("rm-open-items", []))
  ? store.get("rm-open-items", []) : []);
const saveOpenItems = () => store.set("rm-open-items", [...openItems]);
// Client-side filters, remembered per browser.
const FILT = Object.assign({open:false, lane:""}, store.get("rm-filters", {}) || {});
const saveFilt = () => store.set("rm-filters", FILT);
let LAST = null;   // last rendered view, for instant re-render on toggle
let QUERY = "";    // active search filter
const stale = off => document.getElementById("stale").classList.toggle("off", off);
const matches = it => {
  if(FILT.open && laneOf(it) === "done") return false;
  if(FILT.lane && laneOf(it) !== FILT.lane) return false;
  if(!QUERY) return true;
  const q = QUERY.replace(/^#/,"");
  return (""+it.id).includes(q) || (it.title||"").toLowerCase().includes(q)
      || (it.displayId||"").toLowerCase().includes(q)
      || ((it.branch && it.branch.name) || "").toLowerCase().includes(q);
};

// Relative age of an ISO date: "now", "5m", "3h", "2d", "3w", "4mo", "1y".
function age(iso){
  const t = Date.parse(iso||"");
  if(isNaN(t)) return "";
  const s = Math.max(0, (Date.now()-t)/1000);
  if(s < 60) return "now";
  const steps = [[60,"m",60],[3600,"h",24],[86400,"d",7],[604800,"w",4.35],
    [2629800,"mo",12],[31557600,"y",Infinity]];
  for(const [unit,suf,max] of steps){
    const n = Math.floor(s/unit);
    if(n < max) return n+suf+" ago";
  }
  return "";
}
const base = p => String(p||"").split(/[\\/]/).filter(Boolean).pop() || String(p||"");

// VIEW: "trunk" (default — trunk checkout with the git branch overlay),
// "all" (legacy merged worktree checkboxes), or a worktree index.
// The view is deliberately NOT persisted (plan 31): every page load starts on
// "trunk + branches", whichever checkout `serve` was started from and whatever
// was picked before the reload. Filters persist; the view does not. Legacy
// view keys (?view=, localStorage) are ignored and cleared, and the selects
// carry autocomplete="off" so the browser's form restore cannot bring an old
// choice back either.
const DEFAULT_VIEW = "trunk";
let VIEW = DEFAULT_VIEW;
for(const k of ["rm-view","rm-root"]){ try { localStorage.removeItem(k); } catch(_){} }
try {
  if(/[?&](view|root)=/.test(location.search))
    history.replaceState(null, "", location.pathname + location.hash);
} catch(_){}
let LASTP = null;   // last raw payload {_roots, statuses, merged, trunkRoot}
const trunkIdx = P => (P && Number.isInteger(P.trunkRoot)
  && P.trunkRoot < (P.statuses||[]).length) ? P.trunkRoot : 0;

// Pick the selected view out of the payload; a removed/out-of-range worktree
// selection falls back to the trunk view.
function view(P){
  if(VIEW !== "trunk" && VIEW !== "all"
     && !(P.statuses && VIEW < P.statuses.length)) VIEW = "trunk";
  const st = VIEW === "all" ? (P.merged || {})
    : (P.statuses || [P.merged || {}])[VIEW === "trunk" ? trunkIdx(P) : VIEW]
      || P.merged || {};
  return {...st, _roots: P._roots};
}
// Checkout index the item/ideas/changelog endpoints should read.
const viewRoot = it => VIEW === "all"
  ? (it && it._root !== undefined ? it._root : trunkIdx(LASTP))
  : VIEW === "trunk" ? trunkIdx(LASTP) : VIEW;

function syncRootSel(d){
  const sel = document.getElementById("rootsel");
  const roots = d._roots || [];
  sel.hidden = roots.length < 2;
  if(roots.length < 2) return;
  const opt = (v,label) => { const o=document.createElement("option");
    o.value=v; o.textContent=label; return o; };
  sel.replaceChildren(opt("trunk","trunk + branches"),
    opt("all","all worktrees (merged)"),
    ...roots.map((r,i)=>opt(i, "worktree: "+(r.branch || r.name))));
  sel.value = VIEW;
}

function syncLaneSel(items){
  const sel = document.getElementById("laneFilter");
  const n = {};
  for(const it of items){ const l = laneOf(it); n[l] = (n[l]||0)+1; }
  const opt = (v,label) => { const o=document.createElement("option");
    o.value=v; o.textContent=label; return o; };
  // Keep a remembered lane selectable even when it is currently empty.
  const shown = LANES.filter(l => n[l] || l === FILT.lane);
  sel.replaceChildren(opt("","all lanes"),
    ...shown.map(l=>opt(l, l+" ("+(n[l]||0)+")")));
  sel.value = FILT.lane;
}

function laneBadge(it){
  const b = txt("span","lane "+lg(it), laneOf(it));
  const c = it.claim;
  if(c && (c.note || c.updated))
    b.title = [c.note, c.updated && "claimed "+c.updated].filter(Boolean).join(" · ");
  return b;
}

function flightLine(it){
  const line = el("div","flight");
  const b = it.branch, c = it.claim || {};
  if(b){
    line.appendChild(txt("span","bname", b.name));
    if(b.ahead) line.appendChild(txt("span","ahead", "+"+b.ahead));
    if(b.behind) line.appendChild(txt("span",null, "-"+b.behind+" behind"));
    if(b.taggedCommits) line.appendChild(txt("span",null,
      b.taggedCommits+" tagged"));
    const a = age(b.lastDate);
    if(a){ const s = txt("span",null, "last "+a);
      if(b.lastSubject) s.title = b.lastSubject; line.appendChild(s); }
    if(b.worktree){ const w = txt("span","wt", "wt "+base(b.worktree));
      w.title = b.worktree; line.appendChild(w); }
  } else if(c.stage) {
    line.appendChild(txt("span",null, "no branch found"));
  }
  if(c.verdict) line.appendChild(txt("span","verdict "+c.verdict, c.verdict));
  return line;
}

function loadSteps(it, panel){
  fetch("/api/item?id="+it.id+"&root="+viewRoot(it),{cache:"no-store"})
   .then(r=>r.json()).then(d=>{
    panel.replaceChildren();
    if(d.error){ panel.appendChild(txt("div","muted", d.error)); return; }
    if(d.note) panel.appendChild(txt("div","note", d.note));
    if(!d.steps || !d.steps.length)
      panel.appendChild(txt("div","muted","no checklist steps in this plan"));
    for(const s of (d.steps||[])){
      const line = el("div","step");
      line.appendChild(txt("span","box"+(s.done?" done":""), s.done?"✓":"○"));
      line.appendChild(txt("span","stext"+(s.done?" done":""), s.text));
      panel.appendChild(line);
    }
    if(d.claim){
      const c = d.claim, box = el("div","claim");
      box.appendChild(txt("h4",null,"claim"));
      box.appendChild(txt("div",null, [c.stage, c.verdict, c.note,
        c.updated && "updated "+c.updated].filter(Boolean).join(" · ")));
      panel.appendChild(box);
    }
    const b = d.branch;
    if(b){
      const box = el("div","commits");
      box.appendChild(txt("h4",null, "branch "+b.name+(b.ahead?" · +"+b.ahead:"")
        +(b.behind?" · -"+b.behind+" behind":"")+(b.merged?" · merged":"")));
      const cs = b.commits || [];
      if(!cs.length) box.appendChild(txt("div","muted","no commits ahead of trunk"));
      for(const c of cs){
        const row = el("div","commit");
        row.appendChild(txt("span","sha", c.sha||""));
        const a = txt("span","age", age(c.date)); a.title = c.date||"";
        row.appendChild(a);
        row.appendChild(txt("span","subj", c.subject||""));
        box.appendChild(row);
      }
      if(b.ahead > cs.length)
        box.appendChild(txt("div","muted","…"+(b.ahead-cs.length)+" more"));
      panel.appendChild(box);
    }
    if(d.file) panel.appendChild(txt("div","file", ".roadmap/"+d.file));
  }).catch(()=>{ panel.replaceChildren(txt("div","muted","failed to load")); });
}

function itemRow(it){
  const wrap = el("div","item-wrap");
  const row = el("div","item");
  const isO = openItems.has(it.id);
  const fly = inFlight(it);
  row.appendChild(el("span","dot "+lg(it)));
  const title = el("span","title");
  title.appendChild(txt("span","icaret", isO?"▾":"▸"));
  title.appendChild(txt("span","num", it.displayId || "#"+it.id));
  title.appendChild(txt("span","t", it.title));
  title.appendChild(txt("span","badge", it.type));
  if(VIEW === "all" && it.checkout) title.appendChild(txt("span","badge", it.checkout));
  if(it.blockedBy && it.blockedBy.length)
    title.appendChild(txt("span","blockedby",
      "blocked by "+it.blockedBy.map(x=>"#"+x).join(",")));
  row.appendChild(title);
  const right = el("span","right");
  if(fly) right.appendChild(laneBadge(it));
  // Trunk checkboxes tick at the merge gate, so an in-flight item at 0% gets
  // a striped lane-coloured bar instead of an empty one that reads as idle.
  const bar = el("span","bar"+(fly && !(it.pct>0) ? " inflight "+lg(it) : ""));
  if(fly && !(it.pct>0)) bar.title = "in flight on a branch — trunk ticks at merge";
  const fill = el("i");
  fill.style.width = (it.pct||0)+"%"; bar.appendChild(fill);
  right.appendChild(bar);
  right.appendChild(txt("span","frac", (it.done||0)+"/"+(it.total||0)));
  row.appendChild(right);
  if(fly) row.appendChild(flightLine(it));
  row.onclick = () => {
    openItems.has(it.id) ? openItems.delete(it.id) : openItems.add(it.id);
    saveOpenItems();
    if(LAST) render(LAST);
  };
  wrap.appendChild(row);
  if(isO){
    const panel = el("div","steps");
    panel.appendChild(txt("div","muted","loading…"));
    wrap.appendChild(panel);
    loadSteps(it, panel);
  }
  return wrap;
}

function verSection(v, items, cur){
  const gd = items.reduce((a,i)=>a+(i.done||0),0);
  const gt = items.reduce((a,i)=>a+(i.total||0),0);
  const nf = items.filter(inFlight).length;
  const sec = el("section","ver-group");
  // While searching/filtering, force every shown group open so matches show.
  if(!QUERY && !FILT.lane && !isOpen(v,cur)) sec.classList.add("collapsed");
  sec.dataset.v = v;
  const head = el("div","ver-head");
  head.appendChild(txt("span","chev","▾"));
  head.appendChild(txt("h2",null,"v"+v+(v===cur?" · current":"")));
  head.appendChild(txt("span","vpct",
    (nf ? nf+" in flight · " : "")+(gt?Math.round(100*gd/gt):0)+"% · "+gd+"/"+gt));
  head.onclick = () => {
    sec.classList.toggle("collapsed");
    prefs[v] = !sec.classList.contains("collapsed");
    savePrefs();
  };
  sec.appendChild(head);
  const box = el("div","items");
  for(const it of items) box.appendChild(itemRow(it));
  sec.appendChild(box);
  return sec;
}

// Unmerged branches not attributed to any item (fix/*, experiments, release
// branches): listed, never dropped. Collapsed by default.
function otherSection(list){
  const KEY = "__otherBranches";
  const sec = el("section","ver-group");
  if(!(prefs[KEY])) sec.classList.add("collapsed");
  const head = el("div","ver-head");
  head.appendChild(txt("span","chev","▾"));
  head.appendChild(txt("h2",null,"other branches"));
  head.appendChild(txt("span","vpct", list.length+" unmerged"));
  head.onclick = () => {
    sec.classList.toggle("collapsed");
    prefs[KEY] = !sec.classList.contains("collapsed");
    savePrefs();
  };
  sec.appendChild(head);
  const box = el("div","items");
  for(const b of list){
    const row = el("div","ob");
    const n = txt("span","bname", b.name||"");
    if(b.lastSubject) n.title = b.lastSubject;
    row.appendChild(n);
    row.appendChild(txt("span","ahead", b.ahead ? "+"+b.ahead : ""));
    row.appendChild(txt("span","muted", age(b.lastDate)));
    const w = txt("span","muted", b.worktree ? "wt "+base(b.worktree) : "");
    if(b.worktree) w.title = b.worktree;
    row.appendChild(w);
    box.appendChild(row);
  }
  sec.appendChild(box);
  return sec;
}

function render(d){
  LAST = d;
  syncRootSel(d);
  document.getElementById("project").textContent = d.project || "roadmap";
  document.getElementById("cver").textContent =
    d.currentVersion ? "v"+d.currentVersion : "";
  const items = d.items || [];
  syncLaneSel(items);
  document.getElementById("openOnly").checked = !!FILT.open;
  const td = items.reduce((a,i)=>a+(i.done||0),0);
  const tt = items.reduce((a,i)=>a+(i.total||0),0);
  document.getElementById("overall").textContent =
    tt ? Math.round(100*td/tt)+"% overall ("+td+"/"+tt+")" : "";
  document.getElementById("hbarfill").style.width = (tt?100*td/tt:0)+"%";
  const chip = (n,label,cls) => {
    const c = el("span","chip");
    c.appendChild(el("span","cdot"+(cls?" "+cls:"")));
    c.appendChild(txt("span",null, n+" "+label));
    return c;
  };
  // done / in-flight / active / planned: every item in exactly one bucket
  // (mirrors the CLI's lane_counts; computed here so every view gets it).
  const k = {done:0, fly:0, active:0, planned:0};
  for(const it of items){
    if(laneOf(it) === "done") k.done++;
    else if(inFlight(it)) k.fly++;
    else if(it.status === "active") k.active++;
    else k.planned++;
  }
  const nblocked = items.filter(i=>i.blockedBy&&i.blockedBy.length).length;
  document.getElementById("counts").replaceChildren(
    chip(items.length, "items", null),
    chip(k.done, "done", "done"),
    chip(k.fly, "in flight", "lg-build"),
    chip(k.active, "active", "active"),
    chip(k.planned, "planned", null),
    ...(nblocked ? [chip(nblocked, "blocked", "blocked")] : []));
  const app = document.getElementById("app");
  const others = Array.isArray(d.otherBranches) ? d.otherBranches : [];
  const tail = others.length ? [otherSection(others)] : [];
  if(!items.length){
    app.replaceChildren(txt("div","empty", d.error||"no roadmap items yet"), ...tail);
    return;
  }
  const groups = {};
  for(const it of items){ if(matches(it)) (groups[it.version] ||= []).push(it); }
  const cur = d.currentVersion;
  // Numeric semver compare (descending) so 0.10.0 sorts above 0.9.0, not below.
  const vkey = v => String(v).split(".").map(n=>parseInt(n,10)||0);
  const vcmp = (a,b) => {
    const A=vkey(a), B=vkey(b);
    for(let i=0; i<Math.max(A.length,B.length); i++){
      const diff=(B[i]||0)-(A[i]||0); if(diff) return diff;
    }
    return 0;
  };
  const vers = Object.keys(groups).sort((a,b)=>
    a===cur?-1:b===cur?1:vcmp(a,b));
  if(!vers.length){
    const why = QUERY ? "no items match “"+QUERY+"”"
      : FILT.lane ? "no items in lane “"+FILT.lane+"”" : "no open items";
    app.replaceChildren(txt("div","empty", why), ...tail);
    return;
  }
  // One clean column, current version first; other branches last.
  app.replaceChildren(...vers.map(v=>verSection(v, groups[v], cur)), ...tail);
}

document.getElementById("search").addEventListener("input", e => {
  QUERY = e.target.value.trim().toLowerCase();
  if(LAST) render(LAST);
});
document.getElementById("openOnly").addEventListener("change", e => {
  FILT.open = e.target.checked; saveFilt();
  if(LAST) render(LAST);
});
document.getElementById("laneFilter").addEventListener("change", e => {
  FILT.lane = e.target.value; saveFilt();
  if(LAST) render(LAST);
});
document.getElementById("expandAll").onclick = () => {
  if(!LAST) return;
  for(const it of (LAST.items||[])) prefs[it.version] = true;
  savePrefs(); render(LAST);
};
document.getElementById("collapseAll").onclick = () => {
  if(!LAST) return;
  for(const it of (LAST.items||[])) prefs[it.version] = false;
  savePrefs(); render(LAST);
};

// Server-Sent Events: server pushes a fresh status on every .roadmap or
// branch-ref change. EventSource auto-reconnects on drop, so a closed
// terminal just goes stale-grey.
let es;
function connect(){
  es = new EventSource("/events");
  es.onmessage = ev => { try { LASTP = JSON.parse(ev.data);
    render(view(LASTP)); stale(false);
    if(TAB === "ideas") loadIdeas();
    if(TAB === "changelog") loadChangelog(); } catch(_){} };
  es.onerror = () => stale(true);
}
document.getElementById("rootsel").addEventListener("change", e => {
  const v = e.target.value;
  VIEW = (v === "trunk" || v === "all") ? v : (parseInt(v, 10) || 0);
  if(LASTP) render(view(LASTP));   // view switch is local — no reconnect
  if(TAB !== "roadmap") setTab(TAB);   // re-fetch the open pane for this root
});
// A page restored from the back/forward cache keeps its JS state; a fresh
// view is still the rule, so reset it there too.
window.addEventListener("pageshow", e => {
  if(e.persisted && VIEW !== DEFAULT_VIEW){
    VIEW = DEFAULT_VIEW; if(LASTP) render(view(LASTP));
  }
});
// Relative ages ("3h ago") drift without new data; refresh them each minute.
setInterval(() => { if(LAST && TAB === "roadmap") render(LAST); }, 60000);
// ---- tabs -------------------------------------------------------------
// Three read-only views over the same server. Roadmap is SSE-driven; Ideas and
// Changelog are fetched on activation and refreshed whenever a new SSE payload
// lands, so they track edits without their own polling.
const TABS = [["roadmap","Roadmap"],["ideas","Ideas"],["changelog","Changelog"]];
let TAB = store.get("rm-tab", "roadmap");
if(!TABS.some(t=>t[0]===TAB)) TAB = "roadmap";
const paneOf = t => document.getElementById(t==="roadmap" ? "app" : t);

function renderTabs(counts){
  const bar = document.getElementById("tabs");
  bar.replaceChildren(...TABS.map(([id,label])=>{
    const b = el("div","tab"+(id===TAB?" on":""));
    b.appendChild(document.createTextNode(label));
    if(counts && counts[id] != null) b.appendChild(txt("span","n", counts[id]));
    b.onclick = () => setTab(id);
    return b;
  }));
}

function setTab(t){
  TAB = t; store.set("rm-tab", t);
  for(const [id] of TABS) paneOf(id).hidden = id !== t;
  document.getElementById("rmctrls").hidden = t !== "roadmap";
  renderTabs(TABCOUNTS);
  if(t === "ideas") loadIdeas();
  if(t === "changelog") loadChangelog();
}

const TABCOUNTS = {};
const rootParam = () => "?root=" + viewRoot(null);

function loadIdeas(){
  const pane = document.getElementById("ideas");
  fetch("/api/ideas"+rootParam(),{cache:"no-store"}).then(r=>r.json()).then(d=>{
    const items = d.bullets || [];
    TABCOUNTS.ideas = items.length; renderTabs(TABCOUNTS);
    if(!items.length){
      pane.replaceChildren(txt("div","empty",
        d.error || "no ideas parked yet — /roadmap-idea · /roadmap-idea"));
      return;
    }
    const out = [txt("div","srcfile", d.file || "")];
    for(const b of items){
      const row = el("div","idea");
      row.appendChild(txt("span","bullet","•"));
      row.appendChild(txt("span","body", b.body));
      out.push(row);
    }
    pane.replaceChildren(...out);
  }).catch(()=>pane.replaceChildren(txt("div","empty","failed to load ideas")));
}

function loadChangelog(){
  const pane = document.getElementById("changelog");
  fetch("/api/changelog"+rootParam(),{cache:"no-store"}).then(r=>r.json()).then(d=>{
    const vers = Array.isArray(d) ? d : [];
    TABCOUNTS.changelog = vers.length; renderTabs(TABCOUNTS);
    if(!vers.length){
      pane.replaceChildren(txt("div","empty",
        (d && d.error) || "nothing user-facing published yet"));
      return;
    }
    pane.replaceChildren(...vers.map(v=>{
      const sec = el("section","rel");
      const h = el("h3");
      h.appendChild(document.createTextNode("v"+v.version));
      if(v.date) h.appendChild(txt("span","date", v.date));
      h.appendChild(txt("span","pill", v.released ? "released" : "in progress"));
      sec.appendChild(h);
      if(v.notes) sec.appendChild(txt("div","blurb", v.notes));
      for(const [name, rows] of Object.entries(v.sections||{})){
        const box = el("div","sec");
        box.appendChild(txt("h4",null,name));
        for(const r of rows)
          box.appendChild(txt("div", r.pending?"pending":null,
            (r.pending?"◦ ":"• ")+r.text));
        sec.appendChild(box);
      }
      if(v.rollup) sec.appendChild(txt("div","srcfile",
        "…plus internal changes not shown here"));
      return sec;
    }));
  }).catch(()=>pane.replaceChildren(txt("div","empty","failed to load changelog")));
}

setTab(TAB);
connect();
</script>
