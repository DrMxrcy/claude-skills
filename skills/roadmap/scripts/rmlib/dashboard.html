// settings.wipLimit (plan 40): the header's in-flight chip turns red, and
// names the limit, once the in-flight count it shows goes over it.
function wipFlag(c, n, wip){
  const lim = wip && wip.limit;
  if(!lim || n <= lim) return c;
  c.className += " over";
  c.lastChild.textContent = n+" in flight (limit "+lim+")";
  c.title = "over settings.wipLimit ("+lim+") — finish or land one first";
  return c;
}
// ---- plan page --------------------------------------------------------
function planPage(r){
  // Which checkout to read: the one the current view shows this item from.
  const items = (LAST && LAST.items) || [];
  const it = items.find(x => x.id === r.id);
  return getJSON("/api/item?id="+r.id+"&root="+viewRoot(it)).then(d => {
    const out = [crumb("#/", "roadmap", d.planPath || "")];
    if(d.error){ out.push(txt("div","empty", d.error)); return out; }
    const row = {...(it||{}), ...d};   // list row fields + fresh detail
    const fly = inFlight(row);
    const head = el("div","phead");
    const h = el("h2");
    h.appendChild(txt("span","num", d.displayId || "#"+d.id));
    h.appendChild(txt("span",null, d.title||""));
    head.appendChild(h);
    const meta = el("div","pmeta");
    meta.appendChild(el("span","dot "+lg(row)));
    meta.appendChild(laneBadge(row));
    meta.appendChild(txt("span","badge", d.type||""));
    if(d.version) meta.appendChild(txt("span","badge", "v"+d.version));
    if(d.status) meta.appendChild(txt("span","badge", d.status));
    rulingBadges(d).forEach(b => meta.appendChild(b));
    const acc = acceptBadge(d); if(acc) meta.appendChild(acc);
    meta.appendChild(progressBar(row, fly));
    meta.appendChild(txt("span","frac", (row.done||0)+"/"+(row.total||0)));
    head.appendChild(meta);
    if(fly) { const f = flightLine(row); head.appendChild(f); }
    out.push(head);

    const facts = el("div","facts");
    if(d.note) fact(facts, "note", d.note);
    const c = d.claim;
    if(c){
      const v = [];
      if(c.stage) v.push(txt("span","lane "+lg(row), c.stage));
      if(c.verdict) v.push(txt("span","verdict "+c.verdict, c.verdict));
      if(c.note) v.push(c.note);
      if(c.updated) v.push("updated "+c.updated);
      if(c.branch) v.push("branch "+c.branch);
      if(c.owner) v.push("owner "+c.owner+(c.refreshed && age(c.refreshed)
        ? " · claimed "+age(c.refreshed) : ""));
      fact(facts, "claim", ...v);
    }
    for(const k of ((LAST && LAST.slots && LAST.slots.kinds) || [])){
      const r = (k.reservations||[]).find(x => x.plan === d.id);
      if(r) fact(facts, "slot "+k.kind, txt("span","slot st-"+r.state, r.value),
        r.state+" — "+r.detail);
    }
    const planLinks = ids => (ids||[]).map(x => link("#/plan/"+x, "#"+x));
    fact(facts, "depends on", ...planLinks(d.dependsOn));
    // Follow-ups (plan 46): linked both ways.
    if(d.followUpOf) fact(facts, "follow-up of", ...planLinks([d.followUpOf]));
    fact(facts, "follow-ups", ...planLinks(d.followUps));
    for(const w of (d.waitingSteps||[])){
      const n = daysLeft(w);
      fact(facts, "waiting", txt("span","lane lg-wait"+(n != null && n <= 0 ? " due" : ""),
        countdown(n)), "step "+w.step+": "+w.text,
        w.until ? "until "+w.until : "", w.reason || "");
    }
    // Bug routing (plan 47): a bug's origin and an origin's filed bugs.
    if(row.foundIn != null) fact(facts, "found in", ...planLinks([row.foundIn]));
    fact(facts, "bugs found", ...planLinks(row.bugsFound));
    if(d.blockedBy && d.blockedBy.length){
      const s = el("span","blk");
      s.appendChild(document.createTextNode("blocked by "));
      for(const a of planLinks(d.blockedBy)){ s.appendChild(a);
        s.appendChild(document.createTextNode(" ")); }
      fact(facts, "blocked", s);
    }
    fact(facts, "overlaps", ...overlapsOf(d.id));
    const b = d.branch;
    if(b) fact(facts, "branch", b.name, b.ahead ? "+"+b.ahead+" ahead" : "",
      b.behind ? "-"+b.behind+" behind" : "", b.merged ? "merged" : "",
      b.taggedCommits ? b.taggedCommits+" tagged" : "",
      b.worktree ? "wt "+base(b.worktree) : "");
    if(d.planPath) fact(facts, "plan file", link(noteHref(d.planPath), d.planPath));
    if(d.notes && d.notes.length)
      fact(facts, "notes", ...d.notes.map(n => link(noteHref(n), n)));
    if(facts.childNodes.length) out.push(facts);
    // plan 49: the likely next CLI actions, as text to copy
    const cmds = cmdBlock("next actions — copy into a terminal", planCommands(d, row,
      {slots: LAST && LAST.slots, trunk: trunkName()}));
    if(cmds) out.push(cmds);

    if(b){
      const box = el("div","commits");
      box.appendChild(txt("h4",null, "commits on "+b.name+" not on trunk"));
      const cs = b.commits || [];
      if(!cs.length) box.appendChild(txt("div","muted","no commits ahead of trunk"));
      for(const cm of cs){
        const line = el("div","commit");
        line.appendChild(txt("span","sha", cm.sha||""));
        const a = txt("span","age", age(cm.date)); a.title = cm.date||"";
        line.appendChild(a);
        line.appendChild(txt("span","subj", cm.subject||""));
        box.appendChild(line);
      }
      if(b.ahead > cs.length)
        box.appendChild(txt("div","muted","…"+(b.ahead-cs.length)+" more"));
      out.push(box);
    }
    if(d.acceptance && d.acceptance.bullets && d.acceptance.bullets.length)
      out.push(acceptanceBlock(d.acceptance));
    if(d.rulings && d.rulings.length) out.push(rulingsBlock(d.rulings));
    if(row.foundDuringBuild && row.foundDuringBuild.length){
      const box = el("div","found");
      box.appendChild(txt("h4",null, "🐞 found during build"));
      for(const f of row.foundDuringBuild) box.appendChild(txt("div",null, f));
      out.push(box);
    }
    out.push(md(d.body || "", d.planPath || ""));
    return out;
  });
}

// ---- markdown → DOM -----------------------------------------------------
// A deliberately small renderer for plan and note files: headings, lists
// (nested, with [ ] / [x] tasks), fenced code, quotes, tables, rules and
// inline code / bold / italic / strike / links. It only ever creates
// elements and text nodes — no HTML string is parsed — and links go through
// link(): http(s) URLs and .md paths that map to a #/notes route, nothing else.
const FM = /^---\r?\n[\s\S]*?\r?\n---\r?\n?/;
function md(src, path){
  const root = el("div","md");
  const lines = String(src).replace(FM, "").replace(/\r\n?/g, "\n").split("\n");
  let i = 0, para = null, stack = [];   // stack: [{indent, list}]
  const flush = () => { para = null; };
  const closeLists = () => { stack = []; };
  const appendBlock = node => { flush(); closeLists(); root.appendChild(node); };
  while(i < lines.length){
    const line = lines[i];
    let m;
    if((m = line.match(/^\s*(```|~~~)/))){
      const fence = m[1], buf = [];
      i++;
      while(i < lines.length && !lines[i].trim().startsWith(fence)) buf.push(lines[i++]);
      i++;
      const pre = el("pre"); pre.appendChild(txt("code",null, buf.join("\n")));
      appendBlock(pre); continue;
    }
    if(!line.trim()){ flush(); i++; continue; }
    if((m = line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))){
      const h = el("h"+m[1].length); inline(h, m[2], path); appendBlock(h); i++; continue;
    }
    if(/^\s{0,3}([-*_])(\s*\1){2,}\s*$/.test(line)){ appendBlock(el("hr")); i++; continue; }
    if(/^\s*>/.test(line)){
      const buf = [];
      while(i < lines.length && /^\s*>/.test(lines[i]))
        buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      const q = el("blockquote"), inner = md(buf.join("\n"), path);
      inner.className = "";
      q.appendChild(inner);
      appendBlock(q); continue;
    }
    if(/^\s*\|.*\|\s*$/.test(line) && i+1 < lines.length
       && /^\s*\|?\s*:?-{2,}/.test(lines[i+1])){
      const cells = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const table = el("table"), thead = el("thead"), tbody = el("tbody");
      const hr = el("tr");
      for(const c of cells(line)){ const th = el("th"); inline(th, c, path); hr.appendChild(th); }
      thead.appendChild(hr); table.appendChild(thead);
      i += 2;
      while(i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){
        const tr = el("tr");
        for(const c of cells(lines[i++])){ const td = el("td"); inline(td, c, path); tr.appendChild(td); }
        tbody.appendChild(tr);
      }
      table.appendChild(tbody);
      const w = el("div","tw"); w.appendChild(table); appendBlock(w); continue;
    }
    if((m = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/))){
      flush();
      const indent = m[1].replace(/\t/g, "    ").length;
      const ordered = /\d/.test(m[2]);
      while(stack.length && indent < stack[stack.length-1].indent) stack.pop();
      let top = stack[stack.length-1];
      if(!top || indent > top.indent){
        const list = el(ordered ? "ol" : "ul");
        if(top && top.list.lastChild) (top.list.lastChild.querySelector(":scope > .tbody")
          || top.list.lastChild).appendChild(list);
        else root.appendChild(list);
        top = {indent, list}; stack.push(top);
      }
      const li = el("li");
      const task = m[3].match(/^\[([ xX~])\]\s*(.*)$/);
      if(task){
        const done = /[xX]/.test(task[1]), wait = task[1] === "~";
        li.className = "task" + (done ? " done" : "") + (wait ? " waiting" : "");
        li.appendChild(txt("span","box", done ? "✓" : wait ? "⏳" : "○"));
        const body = el("span","tbody"), t = el("span","ttext");
        inline(t, task[2], path); body.appendChild(t); li.appendChild(body);
      } else inline(li, m[3], path);
      top.list.appendChild(li);
      i++; continue;
    }
    // continuation of a list item or a paragraph
    if(stack.length && /^\s+\S/.test(line) && !para){
      const li = stack[stack.length-1].list.lastChild;
      const tgt = (li && li.querySelector(":scope > .tbody > .ttext")) || li;
      if(tgt){ tgt.appendChild(document.createTextNode(" ")); inline(tgt, line.trim(), path); }
      i++; continue;
    }
    closeLists();
    if(!para){ para = el("p"); root.appendChild(para); }
    else para.appendChild(document.createTextNode(" "));
    inline(para, line.trim(), path);
    i++;
  }
  return root;
}

// Resolve a markdown link target to an in-app route or a safe external URL;
// "" means render the link text only.
function mdHref(ref, path){
  ref = String(ref||"").trim();
  if(/^https?:\/\//i.test(ref)) return ref;
  if(/^#\//.test(ref)) return ref;
  const clean = ref.split("#")[0];
  if(!/\.md$/i.test(clean) || /^[a-z]+:/i.test(clean) || clean.startsWith("/")) return "";
  const dir = String(path||"").split("/").slice(0, -1);
  const tries = [clean.startsWith(".roadmap/") ? [] : dir, [".roadmap"], []];
  for(const b of tries){
    const out = [];
    let ok = true;
    for(const seg of [...b, ...clean.split("/")]){
      if(seg === "" || seg === ".") continue;
      if(seg !== "..") out.push(seg);
      else if(out.length) out.pop();
      else { ok = false; break; }   // climbs above the project root
    }
    const p = out.join("/");
    if(ok && /^\.roadmap\/(notes|plans)\/[^/]+\.md$/.test(p)) return noteHref(p);
  }
  return "";
}

const INLINE_SRC = /(`+)([\s\S]*?[^`])\1(?!`)|!?\[([^\]]*)\]\(([^)\s]*)(?:\s+"[^"]*")?\)|\*\*([^*]+)\*\*|__([^_]+)__|~~([^~]+)~~|\*([^*\s][^*]*)\*|(?<![\w])_([^_\s][^_]*)_(?![\w])|(https?:\/\/[^\s<>()]+[^\s<>().,;:!?'"])/g;
function inline(parent, s, path){
  s = String(s||"");
  let last = 0, m;
  const re = new RegExp(INLINE_SRC.source, "g");   // own lastIndex: inline() recurses
  while((m = re.exec(s))){
    if(m.index > last) parent.appendChild(document.createTextNode(s.slice(last, m.index)));
    if(m[1]) parent.appendChild(txt("code",null, m[2]));
    else if(m[4] !== undefined && m[0][0] !== "!"){
      const href = mdHref(m[4], path);
      const a = href ? link(href, "") : el("span");
      inline(a, m[3], path); parent.appendChild(a);
    }
    else if(m[4] !== undefined) parent.appendChild(document.createTextNode(m[3] || ""));
    else if(m[5] || m[6]){ const b = el("strong"); inline(b, m[5]||m[6], path); parent.appendChild(b); }
    else if(m[7]){ const d = el("del"); inline(d, m[7], path); parent.appendChild(d); }
    else if(m[8] || m[9]){ const e = el("em"); inline(e, m[8]||m[9], path); parent.appendChild(e); }
    else if(m[10]) parent.appendChild(link(m[10], m[10]));
    last = re.lastIndex;
  }
  if(last < s.length) parent.appendChild(document.createTextNode(s.slice(last)));
}

// ---- navigation (plan 49) -------------------------------------------------
// Full-text search page (#/search/<q>): /api/search runs the CLI search over
// titles, item notes, plan bodies, ideas and notes files; hits are grouped
// by the page they open, the match highlighted with a <mark> text node.
const searchHref = q => "#/search/" + encodeURIComponent(String(q||"").trim());
const SNIPS_SHOWN = 5;
function hl(parent, s, m){
  s = String(s||"");
  if(!Array.isArray(m) || !(m[0] >= 0) || !(m[1] > m[0]) || m[1] > s.length){
    parent.appendChild(document.createTextNode(s)); return parent; }
  parent.appendChild(document.createTextNode(s.slice(0, m[0])));
  parent.appendChild(txt("mark", null, s.slice(m[0], m[1])));
  parent.appendChild(document.createTextNode(s.slice(m[1])));
  return parent;
}
// Group hits by target page, in first-hit order: plan, idea, note, other.
function groupHits(hits){
  const groups = [], at = {};
  for(const h of (hits||[])){
    const key = h.id != null ? "p"+h.id : h.idea != null ? "i"+h.idea
      : h.path ? "n"+h.path : "x"+h.ref;
    if(!(key in at)){
      const href = h.id != null ? "#/plan/"+h.id : h.idea != null ? "#/idea/"+h.idea
        : h.path ? noteHref(h.path) : "";
      at[key] = groups.length;
      groups.push({key, href, id:h.id, idea:h.idea, path:h.path, title:h.title,
        kind:h.kind, hits:[]});
    }
    groups[at[key]].hits.push(h);
  }
  return groups;
}
function searchNodes(d, q, items){
  const box = el("div","phead");
  const inp = el("input","fts");
  inp.type = "search"; inp.value = q; inp.placeholder = "search plans, notes, ideas…";
  inp.autocomplete = "off";
  inp.addEventListener("keydown", e => {
    if(e.key === "Enter" && inp.value.trim()) location.hash = searchHref(inp.value); });
  box.appendChild(inp);
  const out = [crumb("#/", "roadmap", ""), box];
  if(!q){ out.push(txt("div","srcfile","type a word and press Enter")); return out; }
  if(d.error){ out.push(txt("div","empty", d.error)); return out; }
  const groups = groupHits(d.hits);
  out.push(txt("div","srcfile", (d.total||0)+" match"+(d.total === 1 ? "" : "es")
    +" in "+groups.length+" place"+(groups.length === 1 ? "" : "s")+" for “"+q+"”"
    +(d.truncated ? " — first "+(d.hits||[]).length+" shown" : "")));
  if(!groups.length) out.push(txt("div","empty","nothing matches “"+q+"”"));
  const byId = {};
  for(const it of (items||[])) byId[it.id] = it;
  for(const g of groups){
    const grp = el("div","hitgrp");
    const hh = el("div","hh");
    const it = g.id != null ? byId[g.id] : null;
    const label = g.id != null ? ((it && it.displayId) || "#"+g.id)+" "+(g.title || (it && it.title) || "")
      : g.idea != null ? "idea "+g.idea : g.path || g.key.slice(1);
    hh.appendChild(link(g.href, label));
    hh.appendChild(txt("span","badge", g.id != null ? "plan" : g.kind));
    grp.appendChild(hh);
    for(const h of g.hits.slice(0, SNIPS_SHOWN)){
      const row = el("div","hit");
      row.appendChild(txt("span","hl", h.kind === "item" ? (h.field || "item")
        : h.line != null ? "line "+h.line : h.kind));
      row.appendChild(hl(el("span","hs"), h.snippet, h.match));
      grp.appendChild(row);
    }
    if(g.hits.length > SNIPS_SHOWN)
      grp.appendChild(txt("div","srcfile", "+"+(g.hits.length-SNIPS_SHOWN)+" more in here"));
    out.push(grp);
  }
  return out;
}
function searchPage(r){
  if(!r.q) return Promise.resolve(searchNodes({hits:[], total:0}, "", []));
  return getJSON("/api/search?q="+encodeURIComponent(r.q)+"&"+rootParam())
    .then(d => searchNodes(d, r.q, (LAST && LAST.items) || []));
}

// Copy-command buttons: the exact text shown is what gets copied. The page
// never runs anything — commands go to the clipboard for a terminal.
const CLI = "roadmap.py";
const sh = s => /^[\w@%+=:,.\/-]+$/.test(String(s)) ? String(s)
  : "'"+String(s).replace(/'/g, "'\\''")+"'";
function copyText(s, btn){
  const ok = () => { btn.textContent = "copied"; btn.classList.add("ok");
    setTimeout(() => { btn.textContent = "copy"; btn.classList.remove("ok"); }, 1200); };
  const fallback = () => {   // no clipboard API: select the shown text instead
    try { const r = document.createRange(); r.selectNodeContents(btn.previousSibling);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      if(document.execCommand("copy")) ok(); else btn.textContent = "select + copy";
    } catch(_){ btn.textContent = "select + copy"; } };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(s).then(ok, fallback);
  else fallback();
}
function cmdBlock(title, cmds){
  if(!cmds.length) return null;
  const box = el("section","cmds");
  box.appendChild(txt("h4",null, title));
  for(const c of cmds){
    const row = el("div","cmd");
    if(c.why) row.appendChild(txt("span","why", c.why));
    row.appendChild(txt("code",null, c.cmd));
    const b = txt("button","copy","copy");
    b.type = "button"; b.title = "copy: "+c.cmd;

// Dependency graph (#/graph): dependsOn edges among the open versions'
// items, laid out in layers left to right (a dependency sits left of what
// needs it), computed here — no library. Nodes take their lane colour; an
// edge whose dependency is unfinished, into an unfinished item, is a
// blocking link and draws red, and a blocked item gets a dashed red border.
// Only items with an edge are drawn; done dependencies outside the open
// versions appear faded for context. Click (or Enter on) a node opens it.
const GRAPH = {NW:176, NH:40, GX:56, GY:14, PAD:8};
function graphModel(items){
  const all = items || [], byId = {};
  for(const it of all) byId[it.id] = it;
  const openV = new Set(all.filter(i => laneOf(i) !== "done").map(i => i.version));
  const scope = new Set(all.filter(i => openV.has(i.version)).map(i => i.id));
  const deps = id => ((byId[id] && byId[id].dependsOn) || []).filter(d => byId[d] && d !== id);
  const edges = [], used = new Set();
  for(const id of [...scope].sort((a,b) => a-b)) for(const d of deps(id)){
    const blocking = laneOf(byId[d]) !== "done" && laneOf(byId[id]) !== "done";
    edges.push({from:d, to:id, blocking}); used.add(d); used.add(id);
  }
  // Longest-path layering; a cycle (the CLI refuses them, but files can be
  // hand-edited) is cut where it is met instead of recursing forever.
  const layer = {}, onPath = new Set();
  const L = id => {
    if(id in layer) return layer[id];
    if(onPath.has(id)) return -1;
    onPath.add(id);
    let l = 0;
    for(const d of deps(id)) if(used.has(d)) l = Math.max(l, L(d)+1);
    onPath.delete(id);
    return layer[id] = l;
  };
  const ids = [...used].sort((a,b) => a-b);
  ids.forEach(L);
  const cols = [];
  for(const id of ids) (cols[layer[id]] ||= []).push(id);
  // Order each column by the mean row of its dependencies (barycentre), so
  // edges run mostly straight; ties keep id order.
  const row = {};
  cols.forEach((col, c) => {
    if(c) col.sort((a,b) => {
      const bc = id => { const ps = deps(id).filter(d => d in row);
        return ps.length ? ps.reduce((s,d) => s+row[d], 0)/ps.length : Infinity; };
      return (bc(a)-bc(b)) || (a-b);
    });
    col.forEach((id, r) => { row[id] = r; });
  });
  const {NW, NH, GX, GY, PAD} = GRAPH;
  const nodes = ids.map(id => {
    const it = byId[id];
    return {id, x: PAD + layer[id]*(NW+GX), y: PAD + row[id]*(NH+GY), layer: layer[id],
      label: it.displayId || "#"+id, title: it.title || "", version: it.version,
      lane: laneOf(it), cls: "lg-"+(LANE_GROUP[laneOf(it)] || "plan"),
      blocked: !!(it.blockedBy && it.blockedBy.length), context: !scope.has(id)};
  });
  const at = {};
  for(const n of nodes) at[n.id] = n;
  for(const e of edges){
    const a = at[e.from], b = at[e.to];
    e.x1 = a.x + NW; e.y1 = a.y + NH/2; e.x2 = b.x; e.y2 = b.y + NH/2;
  }
  const rows = Math.max(0, ...cols.map(c => c.length));
  return {nodes, edges, width: PAD*2 + cols.length*(NW+GX) - (cols.length ? GX : 0),
    height: PAD*2 + rows*(NH+GY) - (rows ? GY : 0),
    loose: [...scope].filter(id => !used.has(id) && laneOf(byId[id]) !== "done").length,
    versions: [...openV].sort(vcmpDesc)};
}
function graphSvg(m){
  const NS = "http://www.w3.org/2000/svg", {NW, NH} = GRAPH;
  const mk = (tag, attrs, cls) => { const e = document.createElementNS(NS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]); if(cls) e.setAttribute("class", cls);
    return e; };
  const svg = mk("svg", {width:m.width, height:m.height, viewBox:"0 0 "+m.width+" "+m.height,
    role:"img"});
  svg.setAttribute("aria-label", "dependency graph: "+m.nodes.length+" items, "
    +m.edges.length+" dependencies");
  const defs = mk("defs", {});
  for(const k of ["", "blocking"]){
    const mark = mk("marker", {id:"garrow"+(k ? "-"+k : ""), viewBox:"0 0 8 8", refX:"8",
      refY:"4", markerWidth:"7", markerHeight:"7", orient:"auto"});
    mark.appendChild(mk("path", {d:"M0,0 L8,4 L0,8 z"}, "garrow"+(k ? " "+k : "")));
    defs.appendChild(mark);
  }
  svg.appendChild(defs);
  for(const e of m.edges){
    const mx = (e.x1 + e.x2)/2;
    const p = mk("path", {d:"M"+e.x1+","+e.y1+" C"+mx+","+e.y1+" "+mx+","+e.y2+" "+e.x2+","+e.y2,
      "marker-end":"url(#garrow"+(e.blocking ? "-blocking" : "")+")"},
      "gedge"+(e.blocking ? " blocking" : ""));
    p.setAttribute("data-from", e.from); p.setAttribute("data-to", e.to);
    svg.appendChild(p);
  }
  const clip = (s, n) => s.length > n ? s.slice(0, n-1)+"…" : s;
  for(const n of m.nodes){
    const g = mk("g", {transform:"translate("+n.x+","+n.y+")", tabindex:"0", role:"link"},
      "gnode "+n.cls+(n.blocked ? " blocked" : "")+(n.context ? " ctx" : ""));
    g.setAttribute("aria-label", n.label+" "+n.title);
    g.setAttribute("data-id", n.id);
    const tip = mk("title", {}); tip.textContent = n.label+" "+n.title+" · v"+n.version
      +" · "+n.lane+(n.blocked ? " · blocked" : "");
    g.appendChild(tip);
    g.appendChild(mk("rect", {width:NW, height:NH, rx:"6"}));
    const t1 = mk("text", {x:"8", y:"15"}, "gid"); t1.textContent = n.label+" · "+n.lane;
    const t2 = mk("text", {x:"8", y:"31"}); t2.textContent = clip(n.title, 24);
    g.append(t1, t2);
    const open = () => { location.hash = "#/plan/"+n.id; };
    g.addEventListener("click", open);
    g.addEventListener("keydown", ev => { if(ev.key === "Enter"){ ev.preventDefault(); open(); } });
    svg.appendChild(g);
  }
  return svg;
}
function graphNodes(items){
  const out = [crumb("#/", "roadmap", "")];

  const leg = el("div","glegend");
  leg.appendChild(txt("span",null, m.versions.length

// Plan page copy buttons: the likely next CLI actions for the item in view,
// chosen from its lane, open steps, claim owner, slots and rulings.
const trunkName = () => ((LASTP && (LASTP.statuses||[])[trunkIdx(LASTP)]) || {}).trunk || "main";
function planCommands(d, row, ctx){
  const N = d.id, out = [], lane = laneOf(row || d), c = d.claim || {};
  const clip = (s, n) => { s = String(s||""); return s.length > n ? s.slice(0, n-1)+"…" : s; };
  const take = c.owner && d.me && c.owner !== d.me ? " --take" : "";
  const ev = ' --evidence "<verify command + result>"';
  if(lane !== "done"){
    out.push({why:"what to build next", cmd:CLI+" next"});
    const steps = (d.steps||[]).map((s, i) => ({...s, n:i+1}));
    const due = steps.filter(s => !s.done && s.waiting && (daysLeft(s.waiting) ?? 1) <= 0);
    for(const s of due) out.push({why:"waiting step "+s.n+" is due — tick it once verified",
      cmd:CLI+" check --plan "+N+" --step "+s.n+ev});
    const open = steps.find(s => !s.done && !s.waiting);
    if(open){
      out.push({why:"tick step "+open.n+": "+clip(open.text, 70),
        cmd:CLI+" check --plan "+N+" --step "+open.n+ev});
      out.push({why:"step "+open.n+" built but needs time (soak, review)",
        cmd:CLI+" wait "+N+" --step "+open.n+' --until 7d --reason "<what>"'});
    }
    const claim = (why, args) => out.push({why, cmd:CLI+" claim "+N+" "+args+take});
    if(lane === "review"){
      claim("review passed", "--stage gate-ready --verdict CONFIRMED");
      claim("review found problems", "--stage fixing --verdict PARTIAL");
    } else if(lane === "fixing") claim("fixes done — back to review", "--stage review");
    else if(lane === "gate-ready") claim("merge gate started", "--stage gating");
    else if(lane === "gating") claim("gate merged into "+(ctx.trunk||"main")+" — record the landing",
      "--landed "+sh(ctx.trunk||"main"));
    else if(lane === "landed"){
      out.push({why:"preview ticking landed items trunk now contains", cmd:CLI+" check --landed"});
      out.push({why:"tick them", cmd:CLI+" check --landed --yes"});
    } else if(lane !== "waiting") claim("hand to review", "--stage review");
    if(c.owner && take) out.push({why:"held by "+c.owner+" — the claim commands above take it over",
      cmd:CLI+" claim "+N+" --owner "+sh(d.me)+" --take"});
    // Acceptance ledger (plan 43): the first criterion not yet met.
    const acc = ((d.acceptance && d.acceptance.bullets) || [])
      .find(b => b.kind !== "guard" && b.state !== "met");
    if(acc){
      out.push({why:"acceptance "+acc.n+(acc.state === "failed" ? " (failed)" : "")+": "
        +clip(acc.text, 70), cmd:CLI+" accept "+N+" --line "+acc.n+ev});
      out.push({why:"list the acceptance ledger", cmd:CLI+" accept "+N});
    }
    for(const k of ((ctx.slots && ctx.slots.kinds) || [])){
      const held = (k.reservations||[]).some(r => r.plan === N);
      out.push(held ? {why:"check its "+k.kind+" number for clashes", cmd:CLI+" slot "+N+" --check"}
        : {why:"reserve the next "+k.kind+" number", cmd:CLI+" slot "+N+" --kind "+sh(k.kind)});
    }
  }
  if(d.needsApproval) out.push({why:"sign off (approval required)",
    cmd:CLI+" ruling "+N+' --text "<sign-off>" --approval'});
  out.push({why:"record a decision", cmd:CLI+" ruling "+N+' --text "<decision>"'});
  out.push({why:"file a bug found in this item", cmd:CLI+' bug "<title>" --found-in '+N});
  return out;
}

// ---- keyboard layer (plan 49) ---------------------------------------------
//   /  search   g l|b|i|c|g|v  go to list/board/ideas/changelog/graph/versions
//   j k  move through rows   Enter  open   Esc  back   ?  this sheet
//   Ctrl/Cmd+K  command palette
// Single keys are inert while typing in a field (or with a modifier held);
// the Ctrl/Cmd+K chord is the one shortcut that works from anywhere.
const GO = {l:"#/", b:"#/board", i:"#/ideas", c:"#/changelog", g:"#/graph", v:"#/versions"};
const SHORTCUTS = [["/","search (Enter on the list filter: full-text)"],
  ["g l","go to the roadmap list"], ["g b","go to the lane board"], ["g i","go to ideas"], ["g c","go to changelog"],
  ["g g","go to the dependency graph"], ["g v","go to versions"],
  ["j / k","next / previous row"], ["Enter","open the selected row"],
  ["Esc","back"], ["?","show / hide this sheet"], ["Ctrl/⌘ K","jump to any plan, idea, version or page"]];
const NAV_ROWS = ".item, .bcard, .idea, .hitgrp, .vrow, .gnode, .dgsec > div, .rel";
let KSEL_IDX = -1, FOCUS_SEARCH = false, G_PENDING = 0;
const NAV_STACK = [];
function isTyping(t){
  if(!t || !t.tagName) return false;
  if(t.isContentEditable) return true;
  if(t.tagName === "TEXTAREA" || t.tagName === "SELECT") return true;
  return t.tagName === "INPUT"
    && !/^(checkbox|radio|button|submit|reset|range|color|file)$/i.test(t.type || "");
}
// Pure: the action for one key event. st = {typing, mod, palette, pending}.
function keyAction(key, st){
  if(st.palette) return {act:"palette"};
  if(st.typing || st.mod) return null;
  if(st.pending) return GO[key] ? {act:"go", href:GO[key]} : {act:"cancel"};
  switch(key){
    case "/": return {act:"search"};
    case "g": return {act:"pending"};
    case "j": return {act:"move", by:1};
    case "k": return {act:"move", by:-1};
    case "Enter": return {act:"open"};
    case "Escape": return {act:"back"};
    case "?": return {act:"help"};
  }
  return null;
}
function visiblePane(){
  for(const id of ["app","board","ideas","changelog","digest","page"]){
    const p = document.getElementById(id); if(p && !p.hidden) return p; }
  return document.body;
}
function navRows(){
  return [...visiblePane().querySelectorAll(NAV_ROWS)].filter(r => r.getClientRects().length);
}
function moveSel(by){
  const rows = navRows();
  if(!rows.length) return;
  const cur = rows.findIndex(r => r.classList.contains("kbsel"));
  const from = cur >= 0 ? cur : Math.min(KSEL_IDX, rows.length-1);
  const i = from < 0 ? (by > 0 ? 0 : rows.length-1)
    : Math.max(0, Math.min(rows.length-1, from+by));
  for(const r of rows) r.classList.remove("kbsel");
  rows[i].classList.add("kbsel");
  KSEL_IDX = i;
  if(rows[i].classList.contains("gnode")) rows[i].focus();
  rows[i].scrollIntoView({block:"nearest"});
}
function openRow(row){
  const a = row.matches("a[href]") ? row : row.querySelector("a[href]");
  const h = a && a.getAttribute("href");
  if(h && /^#\//.test(h)) location.hash = h;
  else if(a) a.click();
  else row.dispatchEvent(new MouseEvent("click", {bubbles:true}));
}
function goBack(){
  if(NAV_STACK.length > 1){ history.back(); return; }
  const up = ROUTE.name === "version" ? "#/versions" : ROUTE.name === "roadmap" ? "" : "#/";
  if(up) location.hash = up;
}
function focusSearch(){
  const f = document.querySelector("#page:not([hidden]) .fts");
  if(f){ f.focus(); f.select(); return; }
  const s = document.getElementById("search");
  if(!document.getElementById("rmctrls").hidden){ s.focus(); s.select(); return; }
  FOCUS_SEARCH = true;
  location.hash = "#/";
}
window.addEventListener("hashchange", () => {
  const h = location.hash || "#/";
  if(NAV_STACK.length > 1 && NAV_STACK[NAV_STACK.length-2] === h) NAV_STACK.pop();
  else NAV_STACK.push(h);
});
NAV_STACK.push(location.hash || "#/");
document.addEventListener("keydown", e => {
  const chord = (e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "k" || e.key === "K");
  if(e.isComposing) return;
  if(SHEET && !chord && (e.key === "Escape" || e.key === "?")){
    e.preventDefault(); toggleSheet(false); return; }
  const a = keyAction(e.key, {palette: chord, typing: isTyping(e.target),
    mod: e.ctrlKey || e.metaKey || e.altKey, pending: G_PENDING > Date.now()});
  if(!a) return;
  if(a.act !== "pending") G_PENDING = 0;
  if(a.act === "open"){
    // Enter belongs to a focused link/button/node; rows only when nothing is.
    const t = e.target;
    if(t && t.closest && t.closest("a, button, [tabindex], summary")) return;
    const row = navRows().find(r => r.classList.contains("kbsel"));
    if(!row) return;
    e.preventDefault(); openRow(row); return;
  }
  e.preventDefault();
  if(a.act === "palette") togglePalette();
  else if(a.act === "search") focusSearch();
  else if(a.act === "pending") G_PENDING = Date.now() + 1500;
  else if(a.act === "go") location.hash = a.href;
  else if(a.act === "move") moveSel(a.by);
  else if(a.act === "back") goBack();
  else if(a.act === "help") toggleSheet(true);
});

// Shortcut sheet (?)
let SHEET = null;
function toggleSheet(on){

// Command palette (Ctrl/Cmd+K): jump to any plan, idea, version or page by
// fuzzy name. Entries come from the streamed status; ideas are fetched once
// per opening. Results are text nodes; choosing one only changes the route.
const PAGES = [["#/","Roadmap list"],["#/board","Lane board"],["#/ideas","Ideas"],["#/changelog","Changelog"],

const PAL_SHOWN = 40;
// Pure: score `s` against query `q` (higher is better, -1 = no match). Every
// space-separated token must match, as a substring (best: early, at a word

  s = String(s||"").toLowerCase();
  let total = 0;
  for(const t of String(q||"").toLowerCase().split(/\s+/).filter(Boolean)){
    const at = s.indexOf(t);
    if(at >= 0){ total += 100 - Math.min(at, 40) + (at === 0 || /\W/.test(s[at-1]) ? 20 : 0); continue; }
    let i = 0, run = 0, sc = 0;
    for(const ch of t){
      const j = s.indexOf(ch, i);
      if(j < 0) return -1;
      run = j === i ? run+1 : 0; sc += 1 + run*2; i = j+1;
    }
    total += sc;
  }
  return total;
}
function paletteEntries(items, ideas){
  const out = PAGES.map(([href, label]) => ({kind:"page", label, href, sub:""}));
  for(const r of versionRows(items, LAST && LAST.currentVersion, {}))
    out.push({kind:"version", label:"v"+r.v, href:"#/version/"+r.v,
      sub: r.pct+"%"+(r.current ? " · current" : "")});
  for(const it of [...(items||[])].sort((a,b) => b.id-a.id))
    out.push({kind:"plan", label:(it.displayId || "#"+it.id)+" #"+it.id+" "+(it.title||""),
      href:"#/plan/"+it.id, sub:"v"+it.version+" · "+laneOf(it)});
  for(const b of (ideas||[]))
    out.push({kind:"idea", label:b.title || b.body || "", href:"#/idea/"+b.index, sub:"idea "+b.index});
  return out;
}
function paletteRank(q, entries){
  if(!String(q||"").trim()) return entries.slice(0, PAL_SHOWN);
  return entries.map((e, i) => ({e, i, s: fuzzy(q, e.label)}))
    .filter(x => x.s >= 0).sort((a,b) => (b.s-a.s) || (a.i-b.i))
    .slice(0, PAL_SHOWN).map(x => x.e);
}
let PAL = null;
function togglePalette(){
  if(PAL){ closePalette(); return; }
  const ov = el("div","overlay"), box = el("div","ovbox");
  const inp = el("input","fts");
  inp.type = "search"; inp.autocomplete = "off";
  inp.placeholder = "jump to a plan, idea, version or page…";
  inp.setAttribute("aria-label", "command palette");
  const list = el("div","pal-list");
  box.append(inp, list); ov.appendChild(box);
  const st = {entries: paletteEntries((LAST && LAST.items) || [], []), shown: [], on: 0};
  const draw = () => {
    const q = inp.value.trim();
    st.shown = paletteRank(q, st.entries);
    if(q) st.shown.push({kind:"search", label:"search everything for “"+q+"”",
      href: searchHref(q), sub:"full-text"});
    st.on = Math.min(st.on, Math.max(0, st.shown.length-1));
    list.replaceChildren(...st.shown.map((x, i) => {
      const r = el("div","pal-row"+(i === st.on ? " on" : ""));
      r.append(txt("span","pk", x.kind), txt("span","pl", x.label), txt("span","ps", x.sub));
      r.addEventListener("click", () => choose(i));
      return r;
    }));
    if(!st.shown.length) list.appendChild(txt("div","empty","no match"));
  };
  const choose = i => { const x = st.shown[i]; if(!x) return; closePalette(); location.hash = x.href; };
  inp.addEventListener("input", () => { st.on = 0; draw(); });
  inp.addEventListener("keydown", e => {
    if(e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      st.on = Math.max(0, Math.min(st.shown.length-1, st.on + (e.key === "ArrowDown" ? 1 : -1)));
      draw();
      const on = list.querySelector(".on"); if(on) on.scrollIntoView({block:"nearest"});
    } else if(e.key === "Enter"){ e.preventDefault(); choose(st.on); }
    else if(e.key === "Escape"){ e.preventDefault(); closePalette(); }
  });
  ov.addEventListener("click", e => { if(e.target === ov) closePalette(); });
  document.body.appendChild(ov);
  PAL = {ov, back: document.activeElement};
  draw();
  inp.focus();
  getJSON("/api/ideas?"+rootParam()).then(d => {
    if(!PAL || PAL.ov !== ov) return;
    st.entries = paletteEntries((LAST && LAST.items) || [], d.bullets || []);
    draw();
  }).catch(() => {});
}
function closePalette(){
  if(!PAL) return;
  PAL.ov.remove();
  const back = PAL.back; PAL = null;
  if(back && back.focus && back !== document.body) try { back.focus(); } catch(_){}
}
function paletteTab(){
  const t = txt("span","tab kb", /Mac|iPhone|iPad/.test(navigator.platform||"") ? "⌘K" : "Ctrl K");
  t.title = "jump to anything (Ctrl/⌘ K) · ? for all shortcuts";
  t.setAttribute("role","button"); t.tabIndex = 0;
  t.addEventListener("click", togglePalette);
  t.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); togglePalette(); } });
  return t;
}

onRoute();
connect();
</script>
