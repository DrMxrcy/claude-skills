<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roadmap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230e1116'/%3E%3Crect x='3' y='4' width='10' height='2' rx='1' fill='%233fb950'/%3E%3Crect x='3' y='7' width='7' height='2' rx='1' fill='%23d29922'/%3E%3Crect x='3' y='10' width='4' height='2' rx='1' fill='%234b5563'/%3E%3C/svg%3E">
<style>
  :root {
    --bg:#0e1116; --line:#232a34; --fg:#e6edf3; --muted:#8b98a5;
    --bar:#242c38; --done:#3fb950; --active:#d29922; --blocked:#f85149;
    --todo:#4b5563; --accent:#58a6ff; --build:#39c5cf; --gate:#a371f7;
    --wait:#db61a2;
  }
  * { box-sizing:border-box; }
  /* #app sets display:flex, which outranks the UA rule for [hidden] — without
     this the Roadmap pane stays visible on every tab. */
  [hidden] { display:none !important; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  header { position:sticky; top:0; z-index:5; background:var(--bg);
    padding:14px 24px 12px; border-bottom:1px solid var(--line); }
  .wrap { max-width:960px; margin:0 auto; }
  .hrow { display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .ver { color:var(--accent); }
  header .overall { margin-left:auto; color:var(--muted); font-size:12px; }
  #stale { display:inline-block; width:8px; height:8px; border-radius:50%;
    background:var(--done); margin-right:6px; vertical-align:middle;
    transition:background .3s; }
  #stale.off { background:var(--todo); }
  .hbar { height:4px; background:var(--bar); border-radius:2px; margin-top:10px;
    overflow:hidden; }
  .hbar > i { display:block; height:100%; width:0; background:var(--done);
    transition:width .3s; }
  .counts { margin-top:9px; color:var(--muted); font-size:12px;
    display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
  .chip { display:inline-flex; align-items:center; gap:6px; }
  .chip .cdot { width:8px; height:8px; border-radius:50%; background:var(--todo); }
  .chip .cdot.done { background:var(--done); }
  .chip .cdot.active { background:var(--active); }
  .chip .cdot.blocked { background:var(--blocked); }
  .chip.over { color:var(--blocked); font-weight:600; }   /* plan 40: over wipLimit */
  .ctrls { margin-left:auto; display:flex; gap:8px; align-items:center; }
  #search { background:var(--bar); border:1px solid var(--line); color:var(--fg);
    border-radius:6px; padding:4px 9px; font:inherit; font-size:12px; width:190px; }
  #search::placeholder { color:var(--muted); }
  #rootsel { background:var(--bar); border:1px solid var(--line); color:var(--fg);
    border-radius:6px; padding:3px 6px; font:inherit; font-size:12px; }
  .lnk { color:var(--muted); cursor:pointer; user-select:none; font-size:12px; }
  .lnk:hover { color:var(--fg); }
  main { max-width:960px; margin:0 auto; padding:18px 24px 60px; }
  #app { display:flex; flex-direction:column; gap:18px; }
  .ver-group { margin:0; }
  .ver-head { display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:6px 0; user-select:none; }
  .ver-head h2 { font-size:13px; margin:0; letter-spacing:.02em; }
  .ver-head .vpct { color:var(--muted); font-size:12px; margin-left:auto; }
  .ver-head .vfc { color:var(--muted); font-size:12px; }
  .vfc .tgt { margin-left:6px; border:1px solid var(--line); border-radius:4px;
    padding:0 5px; }
  .vfc .tgt.ontrack { color:var(--done); border-color:var(--done); }
  .vfc .tgt.atrisk { color:var(--active); border-color:var(--active); }
  .vfc .tgt.late { color:var(--blocked); border-color:var(--blocked); }
  .burn { display:flex; align-items:center; gap:10px; padding:6px 0 8px;
    color:var(--muted); font-size:11px; }
  .burn svg { flex:none; }
  .ver-group.collapsed .items { display:none; }
  .chev { color:var(--muted); transition:transform .15s; }
  .ver-group.collapsed .chev { transform:rotate(-90deg); }
  .item-wrap { border-top:1px solid var(--line); }
  .item { display:grid; grid-template-columns:14px 1fr auto;
    gap:10px; align-items:start; padding:7px 0; cursor:pointer; }
  .item:hover { background:rgba(255,255,255,.02); }
  .icaret { color:var(--muted); flex:none; font-size:10px; width:10px;
    display:inline-block; }
  .steps { padding:2px 0 12px 26px; display:flex; flex-direction:column;
    gap:4px; }
  .steps .note { color:var(--muted); margin-bottom:4px; font-style:normal; }
  .step { display:flex; gap:8px; align-items:baseline; font-size:13px; }
  .step .box { flex:none; color:var(--todo); }
  .step .box.done { color:var(--done); }
  .step .stext.done { color:var(--muted); text-decoration:line-through; }
  .steps .file { color:var(--muted); font-size:11px; margin-top:6px; }
  .steps .muted { color:var(--muted); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--todo);
    margin-top:5px; }
  .dot.done { background:var(--done); }
  .dot.active { background:var(--active); }
  .dot.blocked { background:var(--blocked); }
  .title { display:flex; align-items:baseline; gap:8px; min-width:0;
    flex-wrap:wrap; }
  .title .num { color:var(--muted); flex:none; font-variant-numeric:tabular-nums; }
  .title .t { white-space:normal; overflow-wrap:anywhere; flex:1 1 auto; }
  .badge { font-size:10px; color:var(--muted); border:1px solid var(--line);
    border-radius:4px; padding:1px 5px; flex:none; }
  .blockedby { font-size:11px; color:var(--blocked); flex:none; }
  .right { display:flex; align-items:center; gap:10px; }
  .bar { width:110px; height:6px; background:var(--bar); border-radius:3px;
    overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--done);
    transition:width .3s; }
  .frac { color:var(--muted); font-size:12px; min-width:38px; text-align:right; }
  .empty { color:var(--muted); padding:40px 0; text-align:center; }
  .tabs { display:flex; gap:4px; margin-top:10px; }
  .tab { color:var(--muted); font-size:12px; padding:4px 10px; cursor:pointer;
    border:1px solid transparent; border-radius:6px; user-select:none; }
  .tab:hover { color:var(--fg); }
  .tab.on { color:var(--fg); background:var(--bar); border-color:var(--line); }
  .tab .n { color:var(--muted); margin-left:6px; font-size:11px; }
  .idea { border-top:1px solid var(--line); padding:8px 0; display:flex;
    gap:10px; align-items:baseline; }
  .idea .bullet { color:var(--active); flex:none; }
  .idea .body { overflow-wrap:anywhere; }
  .srcfile { color:var(--muted); font-size:11px; padding:6px 0 2px; }
  .rel { border-top:1px solid var(--line); padding:12px 0; }
  .rel h3 { margin:0 0 6px; font-size:13px; }
  .rel h3 .date { color:var(--muted); font-weight:400; margin-left:8px;
    font-size:11px; }
  .rel .pill { font-size:10px; color:var(--muted); border:1px solid var(--line);
    border-radius:4px; padding:1px 5px; margin-left:8px; }
  .rel .blurb { color:var(--fg); }
  .rel .sec { margin-top:6px; }
  .rel .sec h4 { margin:0 0 3px; font-size:12px; color:var(--muted);
    font-weight:600; }
  .rel .sec div { padding-left:14px; }
  .rel .pending { color:var(--active); }
  /* digest page (plan 45): #/digest/<since> */
  .dghead { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:8px 0; }
  .dghead .srcfile { padding:0; }
  .dgsec { border-top:1px solid var(--line); padding:8px 0; }
  .dgsec h4 { margin:0 0 4px; font-size:12px; color:var(--muted); font-weight:600; }
  .dgsec div { padding-left:14px; overflow-wrap:anywhere; }
  .dgsec.attention h4 { color:var(--blocked); }
  /* ---- in-flight overlay (plan 30): one colour per lane group ---------- */
  .lg-done { --lc:var(--done); }
  .lg-gate { --lc:var(--gate); }
  .lg-review { --lc:var(--active); }
  .lg-hold { --lc:var(--blocked); }
  .lg-build { --lc:var(--build); }
  .lg-plan { --lc:var(--todo); }
  .lg-wait { --lc:var(--wait); }
  /* waiting steps (plan 46): built, verified only after a date */
  .md li.task.waiting > .box { color:var(--wait); }
  .md li.task.waiting > .tbody > .ttext { color:var(--wait); }
  .lane.due { font-weight:600; }
  .dot[class*="lg-"], .chip .cdot[class*="lg-"] { background:var(--lc); }
  .lane { font-size:10px; border-radius:4px; padding:1px 6px; flex:none;
    color:var(--lc); border:1px solid var(--lc); white-space:nowrap;
    background:color-mix(in srgb, var(--lc) 14%, transparent); }
  .lane.lg-plan { color:var(--muted); }
  .verdict { font-size:10px; border-radius:4px; padding:1px 5px; flex:none;
    font-weight:600; border:1px solid currentColor; }
  .verdict.CONFIRMED { color:var(--done); }
  .verdict.PARTIAL { color:var(--active); }
  .verdict.REFUTED { color:var(--blocked); }
  .flight { grid-column:2 / 4; display:flex; gap:10px; flex-wrap:wrap;
    align-items:center; font-size:12px; color:var(--muted); margin-top:-2px; }
  .flight .bname { color:var(--fg); overflow-wrap:anywhere; }
  .flight .ahead { color:var(--build); font-variant-numeric:tabular-nums; }
  .flight .owner { color:var(--fg); }
  .flight .wt { border:1px dashed var(--line); border-radius:4px;
    padding:0 5px; font-size:11px; }
  .bar.inflight { background:repeating-linear-gradient(-45deg,
    color-mix(in srgb, var(--lc) 35%, transparent) 0 4px, var(--bar) 4px 8px); }
  .filters { display:flex; gap:10px; align-items:center; }
  .filters label { display:inline-flex; gap:5px; align-items:center;
    cursor:pointer; user-select:none; }
  .filters input[type=checkbox] { accent-color:var(--accent); margin:0; }
  #laneFilter { background:var(--bar); border:1px solid var(--line);
    color:var(--fg); border-radius:6px; padding:3px 6px; font:inherit;
    font-size:12px; }
  .commits { margin-top:8px; display:flex; flex-direction:column; gap:3px; }
  .commits h4, .claim h4 { margin:0 0 2px; font-size:12px; color:var(--muted);
    font-weight:600; }
  .commit { display:grid; grid-template-columns:auto auto 1fr; gap:10px;
    font-size:12px; align-items:baseline; }
  .commit .sha { color:var(--accent); }
  .commit .age { color:var(--muted); min-width:52px; }
  .commit .subj { overflow-wrap:anywhere; }
  .claim { margin-top:8px; font-size:12px; }
  .ob { display:grid; grid-template-columns:1fr auto auto auto; gap:12px;
    font-size:12px; padding:5px 0; border-top:1px solid var(--line);
    align-items:baseline; }
  .ob .bname { overflow-wrap:anywhere; }
  .ob .muted { color:var(--muted); }
  .ob .ahead { color:var(--build); }
  /* ---- pages (plan 31): #/plan/<id>, #/idea/<n>, #/notes/<file> -------- */
  a { color:var(--accent); }
  .tab { text-decoration:none; }
  .item .t a { color:inherit; text-decoration:none; }
  .item .t a:hover { text-decoration:underline; }
  .idea a.body { color:inherit; text-decoration:none; }
  .idea a.body:hover { text-decoration:underline; }
  .page { display:flex; flex-direction:column; gap:14px; }
  .crumb { display:flex; gap:12px; align-items:baseline; flex-wrap:wrap;
    font-size:12px; color:var(--muted); }
  .crumb a { color:var(--muted); text-decoration:none; }
  .crumb a:hover { color:var(--fg); }
  .crumb .path { overflow-wrap:anywhere; }
  .phead { display:flex; flex-direction:column; gap:8px; }
  .phead h2 { margin:0; font-size:17px; font-weight:600; display:flex;
    gap:10px; align-items:baseline; flex-wrap:wrap; }
  .phead h2 .num { color:var(--muted); font-weight:400; }
  .pmeta { display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    font-size:12px; color:var(--muted); }
  .pmeta .flight { margin-top:0; }
  .facts { display:grid; grid-template-columns:auto 1fr; gap:6px 14px;
    font-size:12px; border-top:1px solid var(--line); padding-top:10px; }
  .facts > .k { color:var(--muted); }
  .facts > .v { display:flex; gap:8px; flex-wrap:wrap; overflow-wrap:anywhere;
    min-width:0; }
  .facts a { text-decoration:none; }
  .facts a:hover { text-decoration:underline; }
  .facts .blk { color:var(--blocked); }
  .hint { font-size:12px; color:var(--muted); border:1px dashed var(--line);
    border-radius:6px; padding:8px 10px; }
  .hint code { color:var(--fg); }
  .md { border-top:1px solid var(--line); padding-top:6px;
    overflow-wrap:anywhere; min-width:0; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin:18px 0 6px;
    font-weight:600; line-height:1.3; }
  .md h1 { font-size:16px; } .md h2 { font-size:15px; }
  .md h3 { font-size:14px; } .md h4, .md h5, .md h6 { font-size:13px;
    color:var(--muted); }
  .md p { margin:6px 0; }
  .md ul, .md ol { margin:4px 0; padding-left:22px; }
  .md li { margin:2px 0; }
  .md li.task { list-style:none; margin-left:-18px; display:flex; gap:8px;
    align-items:baseline; }
  .md li.task > .box { flex:none; color:var(--todo); }
  .md li.task.done > .box { color:var(--done); }
  .md li.task > .tbody { min-width:0; flex:1; }
  .md li.task.done > .tbody > .ttext { color:var(--muted); }
  .md code { background:var(--bar); border-radius:4px; padding:0 4px;
    font-size:12px; }
  .md pre { background:var(--bar); border:1px solid var(--line);
    border-radius:6px; padding:10px 12px; overflow-x:auto; font-size:12px; }
  .md pre code { background:none; padding:0; white-space:pre; }
  .md blockquote { margin:6px 0; padding:2px 12px; color:var(--muted);
    border-left:3px solid var(--line); }
  .md hr { border:0; border-top:1px solid var(--line); margin:14px 0; }
  .md .tw { overflow-x:auto; }
  .md table { border-collapse:collapse; font-size:12px; margin:6px 0; }
  .md th, .md td { border:1px solid var(--line); padding:4px 8px;
    text-align:left; vertical-align:top; }
  .md th { color:var(--muted); font-weight:600; }
  /* ---- numbered slots (plan 33): trunk highest + reservations per kind -- */
  .slots { display:flex; flex-direction:column; gap:6px; font-size:12px; }
  .srow { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .srow .skind { font-weight:600; }
  .srow .muted { color:var(--muted); }
  .slot { border:1px solid var(--line); border-radius:4px; padding:1px 6px;
    color:var(--fg); text-decoration:none; white-space:nowrap; }
  a.slot:hover { text-decoration:underline; }
  .slot.st-ok { color:var(--done); border-color:var(--done); }
  .slot.st-missing { color:var(--muted); }
  .slot.st-clash, .slot.st-taken { color:var(--blocked); border-color:var(--blocked);
    font-weight:600; background:color-mix(in srgb, var(--blocked) 14%, transparent); }
  .slots .serr { color:var(--blocked); }
  /* ---- worktree map (plan 36): one row per linked worktree ------------- */
  .ver-head.wt-over h2, .ver-head.wt-over .vpct { color:var(--blocked); }
  .wtr { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto
    auto auto auto auto; gap:10px; align-items:center; font-size:12px;
    padding:5px 0; border-top:1px solid var(--line); }
  .wtr.wth { color:var(--muted); font-size:11px; border-top:0; }
  .wtr .bname { overflow-wrap:anywhere; }
  .wtr .muted { color:var(--muted); }
  .wtr .ahead { color:var(--build); font-variant-numeric:tabular-nums; }
  .wtr .dirty { color:var(--active); font-variant-numeric:tabular-nums; }
  .wtr .wit { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .wtr .safe { color:var(--done); font-weight:600; }
  .wtr .unsafe { color:var(--muted); }
  .wtcmd { grid-column:1 / -1; font:11px ui-monospace, SFMono-Regular, Menlo,
    monospace; color:var(--muted); user-select:all; overflow-wrap:anywhere; }
  /* ---- conflict risk (plan 41): open branches changing the same files -- */
  .ver-head.cf-high h2, .ver-head.cf-high .vpct { color:var(--blocked); }
  .cfr { display:grid; grid-template-columns:auto minmax(0,1fr) minmax(0,2fr);
    gap:10px; align-items:baseline; font-size:12px; padding:5px 0;
    border-top:1px solid var(--line); }
  .cffiles, .cfo .cff { color:var(--muted); overflow-wrap:anywhere;
    font:11px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .risk { border:1px solid var(--line); border-radius:4px; padding:0 6px;
    font-size:11px; }
  .risk.r-high { color:var(--blocked); border-color:var(--blocked); font-weight:600; }
  .risk.r-medium { color:var(--active); border-color:var(--active); }
  .risk.r-low { color:var(--muted); }
  .cforder { display:flex; gap:8px; flex-wrap:wrap; align-items:baseline;
    font-size:12px; padding:6px 0; border-top:1px solid var(--line); }
  .cforder .muted { color:var(--muted); }
  .cfo { display:inline-flex; gap:6px; align-items:baseline; flex-wrap:wrap;
    margin-right:10px; }
  /* ---- rulings (plan 34): dated decisions, approvals flagged ------------ */
  .rulings { margin-top:8px; display:flex; flex-direction:column; gap:4px; }
  .rulings h4 { margin:0 0 2px; font-size:12px; color:var(--muted); font-weight:600; }
  .ruling { display:grid; grid-template-columns:auto auto 1fr; gap:10px;
    font-size:12px; align-items:baseline; }
  .ruling .rdate { color:var(--muted); font-variant-numeric:tabular-nums; }
  .ruling .rby { color:var(--accent); }
  .ruling .rtext { overflow-wrap:anywhere; }
  .ruling .rctx { color:var(--muted); }
  .appr { color:var(--done); border-color:var(--done); font-weight:600; }
  /* ---- acceptance ledger (plan 43): per-bullet state + evidence ------- */
  .accept { margin-top:8px; display:flex; flex-direction:column; gap:4px; }
  .accept h4 { margin:0 0 2px; font-size:12px; color:var(--muted); font-weight:600; }
  .acc { display:grid; grid-template-columns:auto 1fr; gap:2px 10px;
    font-size:12px; align-items:baseline; }
  .acc .astate { border:1px solid var(--line); border-radius:4px; padding:0 6px;
    font-size:11px; color:var(--muted); text-align:center; min-width:58px; }
  .acc.met .astate { color:var(--done); border-color:var(--done); font-weight:600; }
  .acc.failed .astate { color:var(--blocked); border-color:var(--blocked);
    font-weight:600; }
  .acc .atext { overflow-wrap:anywhere; min-width:0; }
  .acc .alabel { color:var(--muted); }
  .acc .aev { grid-column:2; color:var(--muted); overflow-wrap:anywhere; }
  .acc-open { color:var(--active); border-color:var(--active); }
  .acc-fail { color:var(--blocked); border-color:var(--blocked); font-weight:600; }
  /* ---- bug routing (plan 47): fixes found during build --------------- */
  .found { margin-top:8px; display:flex; flex-direction:column; gap:4px; font-size:12px; }
  .found h4 { margin:0 0 2px; font-size:12px; color:var(--muted); font-weight:600; }
  .found div { overflow-wrap:anywhere; }
  .needs-appr { color:var(--blocked); border-color:var(--blocked); font-weight:600; }
  /* ---- run log (plan 38): trunk health tile + gate timeline ------------ */
  .runs { display:flex; flex-direction:column; gap:8px; font-size:12px; }
  .health { border:1px solid var(--line); border-radius:6px; padding:8px 10px;
    display:flex; flex-direction:column; gap:6px; }
  .health.red { border-color:var(--blocked); }
  .health .hh { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .health .htitle, .gates .htitle { font-weight:600; }
  .runs .muted { color:var(--muted); }
  .shard { border:1px solid var(--line); border-radius:4px; padding:1px 6px;
    white-space:nowrap; color:var(--fg); text-decoration:none; }
  .shard.pass, .gres.pass { color:var(--done); border-color:var(--done); }
  .shard.fail, .gres.fail { color:var(--blocked); border-color:var(--blocked);
    font-weight:600; }
  .failing { margin:0; padding-left:18px; color:var(--blocked);
    overflow-wrap:anywhere; }
  .gates { display:flex; flex-direction:column; gap:4px; }
  .grow { display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    border-top:1px solid var(--line); padding-top:4px; min-width:0; }
  .gres { border:1px solid var(--line); border-radius:4px; padding:0 6px;
    text-transform:uppercase; font-size:11px; }
  .grow .glabel { font-weight:600; overflow-wrap:anywhere; }
  .grow a { text-decoration:none; } .grow a:hover { text-decoration:underline; }
  /* ---- navigation (plan 49): search, versions, graph, keys, copy ------- */
  .fts { background:var(--bar); border:1px solid var(--line); color:var(--fg);
    border-radius:6px; padding:5px 9px; font:inherit; font-size:13px; width:100%; }
  .hitgrp { border-top:1px solid var(--line); padding:8px 0; display:flex;
    flex-direction:column; gap:3px; min-width:0; }
  .hitgrp .hh { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .hitgrp .hh a { text-decoration:none; } .hitgrp .hh a:hover { text-decoration:underline; }
  .hit { display:flex; gap:10px; font-size:12px; align-items:baseline; min-width:0; }
  .hit .hl { color:var(--muted); flex:none; min-width:56px; }
  .hit .hs { overflow-wrap:anywhere; min-width:0; }
  mark { background:color-mix(in srgb, var(--active) 35%, transparent);
    color:var(--fg); border-radius:2px; }
  .kbsel { outline:1px solid var(--accent); outline-offset:2px; border-radius:4px; }
  .ver-head .vlink { font-size:11px; color:var(--muted); text-decoration:none; }
  .ver-head .vlink:hover { color:var(--fg); text-decoration:underline; }
  .vrow { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:10px;
    align-items:center; border-top:1px solid var(--line); padding:7px 0; font-size:13px; }
  .vrow a { text-decoration:none; } .vrow a:hover { text-decoration:underline; }
  .vrow .vfc, .vrow .muted { color:var(--muted); font-size:12px; }
  .lanegrp h4 { margin:8px 0 2px; font-size:12px; font-weight:600;
    display:flex; gap:8px; align-items:center; }
  .clprev h4 { margin:0 0 2px; font-size:12px; color:var(--muted); font-weight:600; }
  .cmds { display:flex; flex-direction:column; gap:6px; font-size:12px;
    border:1px dashed var(--line); border-radius:6px; padding:8px 10px; }
  .cmds h4 { margin:0; font-size:12px; color:var(--muted); font-weight:600; }
  .cmd { display:flex; gap:8px; align-items:center; flex-wrap:wrap; min-width:0; }
  .cmd .why { color:var(--muted); flex:1 1 100%; }
  .cmd code { background:var(--bar); border-radius:4px; padding:2px 6px; flex:1 1 0;
    min-width:0; overflow-wrap:anywhere; user-select:all; color:var(--fg); }
  .copy { background:var(--bar); border:1px solid var(--line); color:var(--fg);
    border-radius:6px; padding:2px 9px; font:inherit; font-size:11px; cursor:pointer;
    flex:none; }
  .copy:hover { border-color:var(--accent); }
  .copy.ok { color:var(--done); border-color:var(--done); }
  .graph { overflow:auto; max-width:100%; border-top:1px solid var(--line);
    padding-top:8px; -webkit-overflow-scrolling:touch; }
  .graph svg { display:block; }
  .gnode { cursor:pointer; outline:none; }
  .gnode rect { fill:color-mix(in srgb, var(--lc, var(--todo)) 14%, var(--bg));
    stroke:var(--lc, var(--todo)); stroke-width:1.2; }
  .gnode.blocked rect { stroke:var(--blocked); stroke-dasharray:4 3; stroke-width:1.6; }
  .gnode.ctx rect { opacity:.55; }
  .gnode:hover rect, .gnode:focus rect, .gnode.kbsel rect { stroke-width:2.6; }
  .gnode text { fill:var(--fg); font:11px ui-monospace,SFMono-Regular,Menlo,monospace; }
  .gnode text.gid { fill:var(--muted); }
  .gedge { fill:none; stroke:var(--muted); stroke-width:1.2; opacity:.7; }
  .gedge.blocking { stroke:var(--blocked); stroke-width:1.8; opacity:1; }
  .garrow { fill:var(--muted); } .garrow.blocking { fill:var(--blocked); }
  .glegend { display:flex; gap:6px 16px; flex-wrap:wrap; align-items:center;
    font-size:12px; color:var(--muted); }
  .overlay { position:fixed; inset:0; z-index:20; background:rgba(0,0,0,.55);
    display:flex; justify-content:center; align-items:flex-start; padding:10vh 16px 16px; }
  .ovbox { background:var(--bg); border:1px solid var(--line); border-radius:8px;
    width:min(560px, 100%); max-height:76vh; display:flex; flex-direction:column;
    overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  .ovbox .fts { border:0; border-bottom:1px solid var(--line); border-radius:0;
    padding:10px 12px; font-size:14px; }
  .pal-list { overflow-y:auto; padding:4px 0; }
  .pal-row { display:flex; gap:10px; align-items:baseline; padding:6px 12px;
    cursor:pointer; font-size:13px; min-width:0; }
  .pal-row .pk { color:var(--muted); font-size:11px; flex:none; min-width:46px; }
  .pal-row .pl { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .pal-row .ps { color:var(--muted); font-size:11px; flex:none; }
  .pal-row.on { background:var(--bar); }
  .sheet { padding:12px 14px; display:grid; grid-template-columns:auto 1fr;
    gap:6px 16px; font-size:13px; overflow-y:auto; }
  .sheet h4 { grid-column:1 / -1; margin:0 0 4px; font-size:13px; }
  .sheet kbd { border:1px solid var(--line); border-radius:4px; padding:0 5px;
    background:var(--bar); font:inherit; font-size:12px; white-space:nowrap; }
  .sheet .muted { grid-column:1 / -1; color:var(--muted); font-size:12px; }
  .tabs { flex-wrap:wrap; }
  .tab.kb { margin-left:auto; }
  /* ---- lane board (plan 37): #/board, one column per lane --------------- */
  body.on-board main, body.on-board header .wrap { max-width:1600px; }
  body.on-board #expandAll, body.on-board #collapseAll { display:none; }
  .board { display:flex; gap:12px; align-items:flex-start; overflow-x:auto;
    padding-bottom:10px; }
  .bcol { flex:0 0 250px; min-width:0; display:flex; flex-direction:column;
    gap:8px; border:1px solid var(--line); border-radius:8px; padding:8px; }
  .bcol.flagged { border-color:color-mix(in srgb, var(--blocked) 55%, var(--line));
    border-style:dashed; }
  .bhead { display:flex; align-items:center; gap:8px; font-size:12px; }
  .bhead .bn { color:var(--muted); margin-left:auto;
    font-variant-numeric:tabular-nums; }
  .bempty { color:var(--muted); font-size:12px; text-align:center; padding:6px 0; }
  .bcard { border:1px solid var(--line); border-left:3px solid var(--lc, var(--todo));
    border-radius:6px; padding:7px 8px; display:flex; flex-direction:column;
    gap:5px; cursor:pointer; font-size:12px; min-width:0; background:var(--bg); }
  .bcard:hover { background:rgba(255,255,255,.03); }
  .bcard.flag { border-color:var(--blocked); border-left-color:var(--blocked); }
  .btop { display:flex; gap:6px; align-items:baseline; flex-wrap:wrap; }
  .btop .num { color:var(--muted); font-variant-numeric:tabular-nums; }
  .bt { overflow-wrap:anywhere; font-size:13px; }
  .bt a { color:inherit; text-decoration:none; }
  .bt a:hover { text-decoration:underline; }
  .bmeta { display:flex; gap:6px; flex-wrap:wrap; align-items:center;
    color:var(--muted); }
  .bmeta .bname { color:var(--fg); overflow-wrap:anywhere; }
  .bmeta .sha { color:var(--accent); }
  .bmeta .owner { color:var(--fg); }
  .bmeta .acc-open { color:var(--active); border-color:var(--active); }
  .bmeta .acc-fail { color:var(--blocked); border-color:var(--blocked); font-weight:600; }
  .bnote { color:var(--muted); overflow-wrap:anywhere; }
  .bfoot { display:flex; gap:6px; flex-wrap:wrap; align-items:center;
    border-top:1px solid var(--line); padding-top:5px; cursor:default; }
  .bfoot select, .bfoot button { background:var(--bar); border:1px solid var(--line);
    color:var(--fg); border-radius:5px; padding:1px 6px; font:inherit;
    font-size:11px; max-width:100%; }
  .bfoot button { cursor:pointer; }
  .bfoot .bcmd { flex:1 1 100%; color:var(--muted); font-size:11px;
    overflow-wrap:anywhere; user-select:all; }
  #chips { flex-basis:100%; }
  .fchips summary { cursor:pointer; user-select:none; color:var(--muted); }
  .fchips[open] summary { margin-bottom:4px; }
  .fgroup { display:flex; gap:5px; flex-wrap:wrap; align-items:center;
    padding:2px 0; }
  .fgroup .fk { color:var(--muted); min-width:56px; }
  .fchip { background:transparent; border:1px solid var(--line); color:var(--muted);
    border-radius:10px; padding:0 8px; font:inherit; font-size:11px; cursor:pointer;
    overflow-wrap:anywhere; max-width:100%; text-align:left; }
  .fchip:hover { color:var(--fg); }
  .fchip.on { color:var(--fg); border-color:var(--accent);
    background:color-mix(in srgb, var(--accent) 16%, transparent); }
  @media (max-width:640px) {
    .board { flex-direction:column; align-items:stretch; overflow-x:visible; }
    .bcol { flex:none; }
  }
  /* ---- end lane board (plan 37) ----------------------------------------- */
  @media (max-width:640px) {
    header, main { padding-left:16px; padding-right:16px; }
    .facts { grid-template-columns:1fr; }
    .ruling { grid-template-columns:auto 1fr; }
    .ruling .rtext { grid-column:1 / -1; }
    .ctrls { margin-left:0; flex-wrap:wrap; }
    .bar { width:60px; }
    .ob { grid-template-columns:1fr auto; }
    .wtr { grid-template-columns:1fr auto; }
    .wtr.wth { display:none; }
  }
</style>

<body>
<header>
  <div class="wrap">
    <div class="hrow">
      <h1><span id="stale" title="live"></span><span id="project">roadmap</span>
        <span class="ver" id="cver"></span></h1>
      <select id="rootsel" autocomplete="off" hidden></select>
      <span class="overall" id="overall"></span>
    </div>
    <div class="hbar"><i id="hbarfill"></i></div>
    <div class="counts" id="counts"></div>
    <div class="tabs" id="tabs"></div>
    <div class="counts" id="rmctrls">
      <div class="ctrls">
        <input id="search" type="search" autocomplete="off" placeholder="filter items · Enter: full-text">
        <span class="filters">
          <label title="hide done items"><input type="checkbox" id="openOnly"> open only</label>
          <select id="laneFilter" title="show one lane"></select>
        </span>
        <span class="lnk" id="expandAll">expand all</span>
        <span class="lnk" id="collapseAll">collapse all</span>
      </div>
      <div id="chips"></div>
    </div>
  </div>
</header>
<main>
  <div id="app"><div class="empty">connecting…</div></div>
  <div id="board" hidden></div>
  <div id="ideas" hidden></div>
  <div id="changelog" hidden></div>
  <div id="digest" hidden></div>
  <div id="page" hidden></div>
</main>
<script>
// All text goes in via textContent (attributes via properties) — never parsed
// as HTML, so branch names and commit subjects (untrusted) cannot inject.
const el = (tag,cls) => { const e=document.createElement(tag);
  if(cls) e.className=cls; return e; };
const txt = (tag,cls,s) => { const e=el(tag,cls); e.textContent=s; return e; };
// localStorage can be missing or throw (private window, blocked site data):
// every read/write goes through these and the page works without them.
const store = {
  get(k, fb){ try { const v = localStorage.getItem(k);
    return v == null ? fb : JSON.parse(v); } catch(_){ return fb; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(_){} },
};
// Lanes (plan 30): derived per item by the CLI; the dashboard only colours
// and filters them. Group -> one colour family.
const LANES = ["building","review","fixing","gate-ready","gating","landed","blocked",
  "stale","waiting","active","planned","done"];
const LANE_GROUP = {done:"done", gating:"gate", "gate-ready":"gate", landed:"done",
  review:"review", fixing:"review", blocked:"hold", stale:"hold",
  building:"build", active:"build", planned:"plan", waiting:"wait"};
const laneOf = it => it.lane || (it.status === "done" || it.pct === 100
  ? "done" : (it.status || "planned"));
const lg = it => "lg-" + (LANE_GROUP[laneOf(it)] || "plan");
// Same predicate as the CLI's is_in_flight: not done (or parked waiting on a
// date, plan 46), and a branch or claim.
const inFlight = it => !["done","waiting"].includes(laneOf(it))
  && !!(it.branch || it.claim);
// Waiting steps (plan 46): days until the step's date, counted from the
// browser's today so a long-open page stays right; null when undated.
const daysLeft = w => {
  if(!w || !/^\d{4}-\d{2}-\d{2}$/.test(w.until||"")) return null;
  const [y,m,d] = w.until.split("-").map(Number), t = new Date();
  return Math.round((Date.UTC(y,m-1,d)
    - Date.UTC(t.getFullYear(), t.getMonth(), t.getDate())) / 864e5);
};
const countdown = n => n == null ? "no date" : n > 0 ? n+"d left"
  : n === 0 ? "due" : (-n)+"d overdue";
// The soonest wait on an item decides its badge.
const nextWait = it => (it.waitingSteps||[]).map(daysLeft)
  .reduce((a,n) => n == null ? a : a == null ? n : Math.min(a,n), null);
// Default: the current version is expanded, all others collapsed. `prefs` holds
// only the versions the user explicitly toggled, so it overrides the default and
// auto-advance still opens whatever the new current version is.
const prefs = store.get("rm-prefs", {}) || {};
const savePrefs = () => store.set("rm-prefs", prefs);
const isOpen = (v,cur) => (v in prefs) ? prefs[v] : (v === cur);
// Items open in a page now (plan 31) — the inline-expand key and the
// remembered tab (now a #/ route) are retired.
for(const k of ["rm-open-items","rm-tab"]){ try { localStorage.removeItem(k); } catch(_){} }
// Client-side filters, remembered per browser.
const FILT = Object.assign({open:false, lane:""}, store.get("rm-filters", {}) || {});
const saveFilt = () => store.set("rm-filters", FILT);
let LAST = null;   // last rendered view, for instant re-render on toggle
let QUERY = "";    // active search filter
const stale = off => document.getElementById("stale").classList.toggle("off", off);
const matches = it => {
  if(FILT.open && laneOf(it) === "done") return false;
  if(FILT.lane && laneOf(it) !== FILT.lane) return false;
  if(!chipMatch(it)) return false;                // filter chips (plan 37)
  if(!QUERY) return true;
  const q = QUERY.replace(/^#/,"");
  return (""+it.id).includes(q) || (it.title||"").toLowerCase().includes(q)
      || (it.displayId||"").toLowerCase().includes(q)
      || ((it.branch && it.branch.name) || "").toLowerCase().includes(q);
};

// Relative age of an ISO date: "now", "5m", "3h", "2d", "3w", "4mo", "1y".
function age(iso){
  const t = Date.parse(iso||"");
  if(isNaN(t)) return "";
  const s = Math.max(0, (Date.now()-t)/1000);
  if(s < 60) return "now";
  const steps = [[60,"m",60],[3600,"h",24],[86400,"d",7],[604800,"w",4.35],
    [2629800,"mo",12],[31557600,"y",Infinity]];
  for(const [unit,suf,max] of steps){
    const n = Math.floor(s/unit);
    if(n < max) return n+suf+" ago";
  }
  return "";
}
const base = p => String(p||"").split(/[\\/]/).filter(Boolean).pop() || String(p||"");

// VIEW: "trunk" (default — trunk checkout with the git branch overlay),
// "all" (legacy merged worktree checkboxes), or a worktree index.
// The view is deliberately NOT persisted (plan 31): every page load starts on
// "trunk + branches", whichever checkout `serve` was started from and whatever
// was picked before the reload. Filters persist; the view does not. Legacy
// view keys (?view=, localStorage) are ignored and cleared, and the selects
// carry autocomplete="off" so the browser's form restore cannot bring an old
// choice back either.
const DEFAULT_VIEW = "trunk";
let VIEW = DEFAULT_VIEW;
for(const k of ["rm-view","rm-root"]){ try { localStorage.removeItem(k); } catch(_){} }
try {
  if(/[?&](view|root)=/.test(location.search))
    history.replaceState(null, "", location.pathname + location.hash);
} catch(_){}
let LASTP = null;   // last raw payload {_roots, statuses, merged, trunkRoot}
const trunkIdx = P => (P && Number.isInteger(P.trunkRoot)
  && P.trunkRoot < (P.statuses||[]).length) ? P.trunkRoot : 0;

// Pick the selected view out of the payload; a removed/out-of-range worktree
// selection falls back to the trunk view.
function view(P){
  if(VIEW !== "trunk" && VIEW !== "all"
     && !(P.statuses && VIEW < P.statuses.length)) VIEW = "trunk";
  const st = VIEW === "all" ? (P.merged || {})
    : (P.statuses || [P.merged || {}])[VIEW === "trunk" ? trunkIdx(P) : VIEW]
      || P.merged || {};
  return {...st, _roots: P._roots, worktrees: P.worktrees, conflicts: P.conflicts};
}
// Checkout index the item/ideas/changelog endpoints should read.
const viewRoot = it => VIEW === "all"
  ? (it && it._root !== undefined ? it._root : trunkIdx(LASTP))
  : VIEW === "trunk" ? trunkIdx(LASTP) : VIEW;

function syncRootSel(d){
  const sel = document.getElementById("rootsel");
  const roots = d._roots || [];
  sel.hidden = roots.length < 2;
  if(roots.length < 2) return;
  const opt = (v,label) => { const o=document.createElement("option");
    o.value=v; o.textContent=label; return o; };
  sel.replaceChildren(opt("trunk","trunk + branches"),
    opt("all","all worktrees (merged)"),
    ...roots.map((r,i)=>opt(i, "worktree: "+(r.branch || r.name))));
  sel.value = VIEW;
}

function syncLaneSel(items){
  const sel = document.getElementById("laneFilter");
  const n = {};
  for(const it of items){ const l = laneOf(it); n[l] = (n[l]||0)+1; }
  const opt = (v,label) => { const o=document.createElement("option");
    o.value=v; o.textContent=label; return o; };
  // Keep a remembered lane selectable even when it is currently empty.
  const shown = LANES.filter(l => n[l] || l === FILT.lane);
  sel.replaceChildren(opt("","all lanes"),
    ...shown.map(l=>opt(l, l+" ("+(n[l]||0)+")")));
  sel.value = FILT.lane;
}

function laneBadge(it){
  const lane = laneOf(it);
  if(lane === "waiting"){
    const n = nextWait(it);
    const b = txt("span","lane "+lg(it)+(n != null && n <= 0 ? " due" : ""),
      "waiting · "+countdown(n));
    b.title = (it.waitingSteps||[]).map(w => "step "+w.step+": "+w.text
      +(w.until ? " — until "+w.until : "")+(w.reason ? " ("+w.reason+")" : ""))
      .join("\n");
    return b;
  }
  const b = txt("span","lane "+lg(it), lane);
  const c = it.claim;
  if(c && (c.note || c.updated))
    b.title = [c.note, c.updated && "claimed "+c.updated].filter(Boolean).join(" · ");
  return b;
}

function flightLine(it){
  const line = el("div","flight");
  const b = it.branch, c = it.claim || {};
  if(b){
    line.appendChild(txt("span","bname", b.name));
    if(b.ahead) line.appendChild(txt("span","ahead", "+"+b.ahead));
    if(b.behind) line.appendChild(txt("span",null, "-"+b.behind+" behind"));
    if(b.taggedCommits) line.appendChild(txt("span",null,
      b.taggedCommits+" tagged"));
    const a = age(b.lastDate);
    if(a){ const s = txt("span",null, "last "+a);
      if(b.lastSubject) s.title = b.lastSubject; line.appendChild(s); }
    if(b.worktree){ const w = txt("span","wt", "wt "+base(b.worktree));
      w.title = b.worktree; line.appendChild(w); }
  } else if(c.stage) {
    line.appendChild(txt("span",null, "no branch found"));
  }
  if(c.verdict) line.appendChild(txt("span","verdict "+c.verdict, c.verdict));
  // Claim owner (plan 40): who holds the item, refreshed when (hover).
  if(c.owner){ const o = txt("span","owner", "owner "+c.owner);
    const a = age(c.refreshed); if(a) o.title = "claimed "+a; line.appendChild(o); }
  return line;
}

function itemRow(it){
  const wrap = el("div","item-wrap");
  const row = el("div","item");
  const fly = inFlight(it);
  const href = "#/plan/"+it.id;
  row.appendChild(el("span","dot "+lg(it)));
  const title = el("span","title");
  title.appendChild(txt("span","num", it.displayId || "#"+it.id));
  const t = el("span","t");
  t.appendChild(link(href, it.title));
  title.appendChild(t);
  title.appendChild(txt("span","badge", it.type));
  rulingBadges(it).forEach(b => title.appendChild(b));
  const acc = acceptBadge(it); if(acc) title.appendChild(acc);
  if(it.foundIn != null) title.appendChild(txt("span","badge", "from #"+it.foundIn));
  if(VIEW === "all" && it.checkout) title.appendChild(txt("span","badge", it.checkout));
  if(it.blockedBy && it.blockedBy.length)
    title.appendChild(txt("span","blockedby",
      "blocked by "+it.blockedBy.map(x=>"#"+x).join(",")));
  row.appendChild(title);
  const right = el("span","right");
  if(fly || laneOf(it) === "waiting") right.appendChild(laneBadge(it));
  right.appendChild(progressBar(it, fly));
  right.appendChild(txt("span","frac", (it.done||0)+"/"+(it.total||0)));
  row.appendChild(right);
  if(fly) row.appendChild(flightLine(it));
  // The whole row opens the plan page; the title is a real link, so
  // middle-click / copy-link / open-in-new-tab work too.
  row.onclick = e => { if(!e.target.closest("a")) location.hash = href; };
  wrap.appendChild(row);
  return wrap;
}

// Rulings (plan 34): a count badge (✓ when any is an approval) and a red
// "needs approval" marker when the plan declares `approval: required` and
// has no approval ruling yet.
function rulingBadges(it){
  const out = [], rs = it.rulings || [];
  if(rs.length){
    const ok = rs.some(r => r.approval);
    const b = txt("span","badge"+(ok ? " appr" : ""),
      "⚖ "+rs.length+(ok ? " ✓" : ""));
    b.title = rs.length+" ruling"+(rs.length === 1 ? "" : "s")
      +(ok ? " · approved" : "");
    out.push(b);
  }
  if(it.needsApproval) out.push(txt("span","badge needs-appr","needs approval"));
  return out;
}
// Acceptance ledger (plan 43): "3/5 accepted" on cards and the plan page —
// green when every criterion is met, red when one failed, amber part-way.
function acceptBadge(it){
  const a = it.acceptance;
  if(!a || !a.total) return null;
  const cls = a.failed ? " acc-fail" : a.met === a.total ? " appr"
    : a.met ? " acc-open" : "";
  const b = txt("span","badge"+cls, a.met+"/"+a.total+" accepted");
  b.title = a.met+" of "+a.total+" acceptance criteria met"
    +(a.failed ? " · "+a.failed+" failed" : "");
  return b;
}
function acceptanceBlock(a){
  const box = el("div","accept");
  box.appendChild(txt("h4",null, "✅ acceptance · "+a.met+"/"+a.total+" accepted"));
  for(const b of a.bullets){

function rulingsBlock(rs){

// Trunk checkboxes tick at the merge gate, so an in-flight item at 0% gets a

function progressBar(it, fly){
  const bar = el("span","bar"+(fly && !(it.pct>0) ? " inflight "+lg(it) : ""));
  if(fly && !(it.pct>0)) bar.title = "in flight on a branch — trunk ticks at merge";

function verSection(v, items, cur){
  const gd = items.reduce((a,i)=>a+(i.done||0),0);
  const gt = items.reduce((a,i)=>a+(i.total||0),0);
  const nf = items.filter(inFlight).length;
  const sec = el("section","ver-group");
  // While searching/filtering, force every shown group open so matches show.
  if(!QUERY && !FILT.lane && !chipsActive() && !isOpen(v,cur)) sec.classList.add("collapsed");
  sec.dataset.v = v;
  const head = el("div","ver-head");
  head.appendChild(txt("span","chev","▾"));
  head.appendChild(txt("h2",null,"v"+v+(v===cur?" · current":"")));
  const vl = link("#/version/"+v, "page →", "vlink");   // plan 49
  vl.onclick = e => e.stopPropagation();
  head.appendChild(vl);
  const fc = ((LAST && LAST.forecast) || {})[v];
  if(fc) head.appendChild(forecastTag(fc));
  head.appendChild(txt("span","vpct",
    (nf ? nf+" in flight · " : "")+(gt?Math.round(100*gd/gt):0)+"% · "+gd+"/"+gt));
  head.onclick = () => {
    sec.classList.toggle("collapsed");
    prefs[v] = !sec.classList.contains("collapsed");
    savePrefs();
  };
  sec.appendChild(head);
  const box = el("div","items");
  if(fc) { const b = burnDown(fc); if(b) box.appendChild(b); }
  for(const it of items) box.appendChild(itemRow(it));
  sec.appendChild(box);
  return sec;
}

// Version forecast (plan 44): finish date at recent pace, its ±1sd range and
// the target grade on the header; a burn-down sparkline at the top of the
// expanded version. Text nodes and SVG attributes only.
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function shortDate(iso){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso||""));
  return m ? MONTHS[+m[2]-1]+" "+(+m[3]) : "?";
}
function forecastTag(f){
  const t = el("span","vfc");
  let s;
  if(f.state === "done") s = "done";
  else if(f.state === "insufficient") s = "not enough history";
  else {
    const r = f.range || [];
    s = "forecast "+shortDate(f.date)+" ("+shortDate(r[0])+"–"+(r[1] ? shortDate(r[1]) : "?")+")";
  }
  t.appendChild(document.createTextNode(s));
  t.title = f.state === "done" ? "no steps left"
    : f.remaining+" steps left"+(f.ahead ? " (+"+f.ahead+" in earlier versions)" : "")
      +" · "+f.pace+"/day over "+f.windowDays+"d ("+f.ticks+" ticks)";
  if(f.target){
    const cls = f.targetStatus ? f.targetStatus.replace(/\s+/g,"") : "";
    const g = txt("span","tgt"+(cls ? " "+cls : ""),
      (f.targetStatus || "target")+" · "+shortDate(f.target));
    g.title = "target "+f.target;
    t.appendChild(g);
  }
  return t;
}
function burnDown(f){
  const pts = Array.isArray(f.burndown) ? f.burndown : [];
  if(f.state === "done" || pts.length < 2) return null;
  const W = 120, H = 24, max = Math.max(1, ...pts);
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", "0 0 "+W+" "+H);
  svg.setAttribute("aria-hidden", "true");
  const line = document.createElementNS(NS, "polyline");
  line.setAttribute("points", pts.map((n,i) =>
    (i*W/(pts.length-1)).toFixed(1)+","+(2+(H-4)*(1-n/max)).toFixed(1)).join(" "));
  line.setAttribute("fill", "none");
  line.setAttribute("stroke", "var(--accent)");
  line.setAttribute("stroke-width", "1.5");
  svg.appendChild(line);
  const wrap = el("div","burn");
  wrap.appendChild(svg);
  wrap.appendChild(document.createTextNode("burn-down, last "+f.windowDays+"d: "
    +pts[0]+" → "+pts[pts.length-1]+" left · "+f.pace+"/day"));
  return wrap;
}

// Numbered slots (plan 33): one row per kind — trunk highest, branches
// highest, then each reservation (number, plan, state), clash/taken in red.
// Absent when settings.slots is not configured, so nothing renders.
function slotStrip(s){
  if(!s || !(s.error || (s.kinds||[]).length)) return [];
  const box = el("section","slots");
  if(s.error){ box.appendChild(txt("div","serr","slots: "+s.error)); return [box]; }
  for(const k of s.kinds){
    const row = el("div","srow");
    row.appendChild(txt("span","skind", k.kind));

    if(k.branchHighest) row.appendChild(txt("span","muted", "branches "+k.branchHighest));
    const rs = k.reservations || [];
    for(const r of rs){

        "slot st-"+r.state);

      row.appendChild(a);

// Run log (plan 38): trunk health tile (latest suite result per shard,
// failing names, integration commits ahead of trunk) and the gate timeline.
// Log URLs go through link(), so only http(s) ever becomes an href.
const GATES_SHOWN = 10;
function fmtDur(sec){
  if(sec == null) return "";
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  return h ? h+"h"+(m ? String(m).padStart(2,"0")+"m" : "")
    : m ? m+"m"+(s ? String(s).padStart(2,"0")+"s" : "") : s+"s";
}
function fmtWhen(iso){
  const t = new Date(iso||"");
  return isNaN(t) ? "" : t.toLocaleString([], {month:"short", day:"numeric",
    hour:"2-digit", minute:"2-digit"});
}
function healthTile(h){
  const shards = (h && h.shards) || [], ahead = (h && h.ahead) || [];
  if(!shards.length && !ahead.length) return null;
  const box = el("section", "health"+(h.green === false ? " red" : ""));
  const head = el("div","hh");
  head.appendChild(txt("span","htitle","trunk health"));
  if(!shards.length) head.appendChild(txt("span","muted","no suite runs recorded"));
  for(const s of shards){
    const chip = link(s.log || "", s.shard+" "+s.result, "shard "+s.result);
    chip.title = [s.label, fmtWhen(s.at), age(s.at)].filter(Boolean).join(" · ");
    head.appendChild(chip);
  }
  box.appendChild(head);
  const failing = [...new Set(shards.flatMap(s => s.failing || []))];
  if(failing.length){
    const ul = el("ul","failing");
    for(const f of failing) ul.appendChild(txt("li", null, f));
    box.appendChild(ul);
  }
  for(const a of ahead) box.appendChild(txt("div","muted",
    a.branch+" is "+a.commits+" commit"+(a.commits === 1 ? "" : "s")+" ahead of trunk"));
  return box;
}
function gateTimeline(runs){
  const gates = (runs||[]).filter(r => r.kind === "gate").slice(0, GATES_SHOWN);
  if(!gates.length) return null;
  const box = el("section","gates");
  box.appendChild(txt("div","htitle","merge gates"));
  for(const g of gates){
    const row = el("div","grow");
    row.appendChild(txt("span","gres "+g.result, g.result));
    row.appendChild(txt("span","glabel", g.label));
    for(const id of (g.items||[])) row.appendChild(link("#/plan/"+id, "#"+id));
    if((g.branches||[]).length) row.appendChild(txt("span","muted", g.branches.join(", ")));
    const when = txt("span","muted", fmtWhen(g.startedAt || g.at));
    when.title = "started "+(g.startedAt || g.at)+" · recorded "+g.at;
    row.appendChild(when);
    if(g.durationSec != null) row.appendChild(txt("span","muted", fmtDur(g.durationSec)));
    if(g.log) row.appendChild(link(g.log, "log"));
    box.appendChild(row);
  }
  return box;
}
function runPanel(d){
  const parts = [healthTile(d.trunkHealth), gateTimeline(d.runs)].filter(Boolean);
  if(!parts.length) return [];
  const box = el("section","runs");
  box.append(...parts);
  return [box];
}

// Branch conflict risk (plan 41): open item branches changing the same
// files — high (git merge-tree finds a conflict) first — then the suggested
// merge order. The same in every view; red header while any pair is high.
function conflictsPanel(c){
  if(!c || !(c.pairs||[]).length) return [];
  const KEY = "__conflicts";
  const n = c.counts || {};
  const sec = el("section","ver-group cfmap");
  if(!(prefs[KEY])) sec.classList.add("collapsed");
  const head = el("div","ver-head"+(n.high ? " cf-high" : ""));
  head.appendChild(txt("span","chev","▾"));
  head.appendChild(txt("h2",null,"conflicts"));
  const sum = txt("span","vpct", c.pairs.length+" overlapping · "+(n.high||0)+" high");
  sum.title = c.mergeTree ? "checked with git merge-tree"
    : "file overlap only (git < 2.38: no merge-tree)";
  head.appendChild(sum);
  head.onclick = () => {
    sec.classList.toggle("collapsed");
    prefs[KEY] = !sec.classList.contains("collapsed");
    savePrefs();
  };
  sec.appendChild(head);
  const box = el("div","items");
  // A branch carrying several items is one node: "FEAT-1 +3".
  const tag = w => (w.displayId || "#"+w.id)
    + ((w.items||[]).length > 1 ? " +"+(w.items.length-1) : "");
  for(const p of c.pairs){
    const row = el("div","cfr");
    row.appendChild(txt("span","risk r-"+p.risk, p.risk));
    const who = el("span","wit");
    const a = link("#/plan/"+p.a.id, tag(p.a)); a.title = p.a.title+" ("+p.a.branch+")";
    const b = link("#/plan/"+p.b.id, tag(p.b)); b.title = p.b.title+" ("+p.b.branch+")";
    who.append(a, txt("span","muted","↔"), b);
    row.appendChild(who);
    const more = (p.fileCount||0) - (p.files||[]).length;
    const f = txt("span","cffiles", (p.files||[]).join(", ")+(more > 0 ? " +"+more+" more" : ""));
    if(p.conflictFiles && p.conflictFiles.length)
      f.title = "conflicts: "+p.conflictFiles.join(", ");
    row.appendChild(f);
    box.appendChild(row);
  }
  const order = c.order || [];
  if(order.length){
    const o = el("div","cforder");
    o.appendChild(txt("span","muted","merge order"));
    order.forEach((x, i) => {
      const a = link("#/plan/"+x.id, (i+1)+". "+tag(x));
      a.title = x.title+" — "+(x.overlaps ? x.overlaps+" overlap"+(x.overlaps > 1 ? "s" : "")
        +(x.high ? ", "+x.high+" high" : "") : "no overlaps");
      o.appendChild(a);
    });
    box.appendChild(o);
  }
  sec.appendChild(box);
  return [sec];
}
// The items a plan's branch overlaps with (plan page "overlaps" fact).
function overlapsOf(id){
  const pairs = (LAST && LAST.conflicts && LAST.conflicts.pairs) || [];
  const on = (w, id) => (w.items || [w.id]).includes(id);
  return pairs.filter(p => on(p.a, id) || on(p.b, id)).map(p => {
    const o = on(p.a, id) ? p.b : p.a;
    const s = el("span","cfo");
    s.appendChild(txt("span","risk r-"+p.risk, p.risk));
    s.appendChild(link("#/plan/"+o.id, o.displayId || "#"+o.id));
    const more = (p.fileCount||0) - (p.files||[]).length;
    s.appendChild(txt("span","cff", (p.files||[]).join(", ")+(more > 0 ? " +"+more+" more" : "")));
    return s;
  });
}

function render(d){
  LAST = d;
  syncRootSel(d);
  document.getElementById("project").textContent = d.project || "roadmap";
  document.getElementById("cver").textContent =
    d.currentVersion ? "v"+d.currentVersion : "";
  const items = d.items || [];
  syncLaneSel(items);
  document.getElementById("openOnly").checked = !!FILT.open;
  syncChips(items);                               // filter chips (plan 37)
  if(ROUTE.name === "board") renderBoard(d);      // lane board (plan 37)
  const td =items.reduce((a,i)=>a+(i.done||0),0);
  const tt = items.reduce((a,i)=>a+(i.total||0),0);
  document.getElementById("overall").textContent =
    tt ? Math.round(100*td/tt)+"% overall ("+td+"/"+tt+")" : "";
  document.getElementById("hbarfill").style.width = (tt?100*td/tt:0)+"%";
  const chip = (n,label,cls) => {
    const c = el("span","chip");
    c.appendChild(el("span","cdot"+(cls?" "+cls:"")));
    c.appendChild(txt("span",null, n+" "+label));
    return c;
  };
  // done / in-flight / active / planned: every item in exactly one bucket
  // (mirrors the CLI's lane_counts; computed here so every view gets it).
  const k = {done:0, fly:0, active:0, planned:0, waiting:0};
  for(const it of items){
    if(laneOf(it) === "done") k.done++;
    else if(laneOf(it) === "waiting") k.waiting++;
    else if(inFlight(it)) k.fly++;
    else if(it.status === "active") k.active++;
    else k.planned++;
  }
  const nblocked = items.filter(i=>i.blockedBy&&i.blockedBy.length).length;
  document.getElementById("counts").replaceChildren(
    chip(items.length, "items", null),
    chip(k.done, "done", "done"),
    wipFlag(chip(k.fly, "in flight", "lg-build"), k.fly, d.wip),
    chip(k.active, "active", "active"),
    chip(k.planned, "planned", null),
    ...(k.waiting ? [chip(k.waiting, "waiting", "lg-wait")] : []),
    ...(nblocked ? [chip(nblocked, "blocked", "blocked")] : []));
  const app = document.getElementById("app");
  const others = Array.isArray(d.otherBranches) ? d.otherBranches : [];
  const tail = [...(others.length ? [otherSection(others)] : []),
    ...conflictsPanel(d.conflicts), ...worktreePanel(d.worktrees)];
  const head = [...slotStrip(d.slots), ...runPanel(d)];
  if(!items.length){
    app.replaceChildren(...head, txt("div","empty", d.error||"no roadmap items yet"), ...tail);
    return;
  }
  const groups = {};
  for(const it of items){ if(matches(it)) (groups[it.version] ||= []).push(it); }
  const cur = d.currentVersion;
  // Numeric semver compare (descending) so 0.10.0 sorts above 0.9.0, not below.
  const vkey = v => String(v).split(".").map(n=>parseInt(n,10)||0);
  const vcmp = (a,b) => {
    const A=vkey(a), B=vkey(b);
    for(let i=0; i<Math.max(A.length,B.length); i++){
      const diff=(B[i]||0)-(A[i]||0); if(diff) return diff;
    }
    return 0;
  };
  const vers = Object.keys(groups).sort((a,b)=>
    a===cur?-1:b===cur?1:vcmp(a,b));
  if(!vers.length){
    const why = QUERY ? "no items match “"+QUERY+"”"
      : FILT.lane ? "no items in lane “"+FILT.lane+"”"
      : chipsActive() ? "no items match the filter chips" : "no open items";
    app.replaceChildren(...head, txt("div","empty", why), ...tail);
    return;
  }
  // One clean column, current version first; other branches last.
  app.replaceChildren(...head, ...vers.map(v=>verSection(v, groups[v], cur)), ...tail);
}

// ---- lane board (plan 37) ---------------------------------------------
// #/board: one column per lane; every item sits in exactly the column of its
// lane (laneOf — the CLI's derive_lane). Read-only by design: a write
// endpoint on a localhost server is reachable from any page the browser
// visits, so moving a card means copying its `roadmap.py claim …` line and
// running it in a terminal. Re-rendered from render(), so SSE refreshes,
// view switches and filter changes all reach it.
const BOARD_PIPE = ["planned","active","building","review","fixing","gate-ready",
  "gating","landed","waiting","done"];
const BOARD_ALWAYS = ["planned","building","review","fixing","gate-ready","gating",
  "landed","done"];                        // shown even when empty
const BOARD_FLAGGED = ["blocked","stale"]; // side columns, flagged cards
const BOARD_DONE_SHOWN = 20;
const BOARD = {allDone: store.get("rm-board-alldone", false) === true};

// [{lane, flagged, items}] in board order. `onlyLane` (the lane filter)
// narrows the board to that one column. Done is newest (highest id) first.
function boardColumns(items, onlyLane){
  const by = {};
  for(const it of items) (by[laneOf(it)] ||= []).push(it);
  const known = [...BOARD_PIPE, ...BOARD_FLAGGED];
  const order = [...known, ...Object.keys(by).filter(l => !known.includes(l)).sort()];
  return order
    .filter(l => onlyLane ? l === onlyLane : BOARD_ALWAYS.includes(l) || (by[l]||[]).length)
    .map(l => ({lane:l, flagged:BOARD_FLAGGED.includes(l),
      items:(by[l]||[]).slice().sort(l === "done" ? (a,b) => b.id-a.id : (a,b) => a.id-b.id)}));
}

function boardCard(it, d){
  const href = "#/plan/"+it.id;
  const card = el("div","bcard "+lg(it)+(BOARD_FLAGGED.includes(laneOf(it)) ? " flag" : ""));
  const top = el("div","btop");
  top.appendChild(txt("span","num", it.displayId || "#"+it.id));
  top.appendChild(txt("span","badge", it.type || ""));
  if(it.version) top.appendChild(txt("span","badge", "v"+it.version));
  card.appendChild(top);
  const t = el("div","bt");
  t.appendChild(link(href, it.title || ""));
  card.appendChild(t);
  const c = it.claim || {}, b = it.branch || {};
  const meta = [];
  const bname = b.name || c.branch;
  if(bname) meta.push(txt("span","bname", bname));
  const sha = boardSha(it);
  if(sha) meta.push(txt("span","sha", sha));
  if(c.verdict) meta.push(txt("span","verdict "+c.verdict, c.verdict));
  if(c.owner) meta.push(txt("span","owner", "owner "+c.owner));
  if(laneOf(it) === "waiting") meta.push(laneBadge(it));   // countdown (plan 46)
  meta.push(...boardSlots(it, d));                         // reservations (plan 33)
  const acc = boardAccept(it);                             // ledger (plan 43)
  if(acc) meta.push(acc);
  if(it.foundIn != null) meta.push(txt("span","badge", "from #"+it.foundIn));
  if(it.blockedBy && it.blockedBy.length) meta.push(txt("span","blockedby",
    "blocked by "+it.blockedBy.map(x => "#"+x).join(",")));
  if(meta.length){ const m = el("div","bmeta"); m.append(...meta); card.appendChild(m); }
  // Last claim note and how long ago the claim was refreshed (or restamped).
  const ago = age(c.refreshed || c.updated);
  if(c.note || ago){
    const n = el("div","bnote");
    if(c.note) n.appendChild(txt("span",null, c.note));
    if(ago) n.appendChild(txt("span","bage", (c.note ? " · " : "")+"claimed "+ago));
    card.appendChild(n);
  }
  const moves = boardMoves(it);
  if(moves.length) card.appendChild(boardFoot(it, moves));
  card.onclick = e => {
    if(!(e.target.closest && e.target.closest("a, .bfoot"))) location.hash = href; };
  return card;
}

// Short sha: the landing commit once landed (claim --landed), else the tip.
function boardSha(it){
  const c = it.claim || {}, b = it.branch || {};
  if(laneOf(it) === "landed" && c.landed_sha) return String(c.landed_sha).slice(0,7);
  return b.lastCommit || (b.sha ? String(b.sha).slice(0,7) : "");
}
function boardSlots(it, d){
  const out = [];
  for(const k of ((d && d.slots && d.slots.kinds) || []))
    for(const r of (k.reservations || [])) if(r.plan === it.id){
      const s = txt("span","slot st-"+r.state, k.kind+" "+((r.numbers||[]).join(",") || r.value));
      s.title = [r.value, r.state+(r.detail ? ": "+r.detail : "")].filter(Boolean).join(" — ");
      out.push(s);
    }
  return out;
}
// "m/t accepted" when the payload carries an acceptance ledger {met, failed, total}.
function boardAccept(it){
  const a = it.acceptance;
  if(!a || !a.total) return null;
  const cls = a.failed ? " acc-fail" : a.met === a.total ? " appr" : a.met ? " acc-open" : "";
  const s = txt("span","badge"+cls, (a.met||0)+"/"+a.total+" accepted");
  if(a.failed) s.title = a.failed+" failed";
  return s;
}

// Mirrors rmlib/parse.py CLAIM_STAGES (a test keeps the two equal).
const BOARD_STAGES = ["review","fixing","gate-ready","gating","blocked","landed"];
const BOARD_NEXT = {planned:"review", active:"review", building:"review", stale:"review",
  fixing:"review", "gate-ready":"gating", gating:"landed"};
// The `roadmap.py claim` lines that move a card, the likely next move first.
// Done and waiting items get none (a waiting item outranks any claim).
function boardMoves(it){
  const lane = laneOf(it), c = it.claim || {};
  if(!Number.isInteger(it.id) || lane === "done" || lane === "waiting") return [];
  const out = [];
  const add = (label, ...args) => { const cmd = ["roadmap.py claim", it.id, ...args].join(" ");
    if(!out.some(m => m.cmd === cmd)) out.push({label, cmd}); };
  if(lane === "review"){
    if(c.verdict === "CONFIRMED") add("→ gate-ready", "--stage gate-ready");
    else if(c.verdict) add("→ fixing", "--stage fixing");
    else add("→ gate-ready, CONFIRMED", "--stage gate-ready --verdict CONFIRMED");
  } else if(lane === "blocked" && c.stage) add("unblock (clear claim)", "--clear");
  else if(BOARD_NEXT[lane]) add("→ "+BOARD_NEXT[lane], "--stage "+BOARD_NEXT[lane]);
  for(const s of BOARD_STAGES) if(s !== lane && s !== c.stage) add("→ "+s, "--stage "+s);
  if(c.stage || c.owner) add("clear claim", "--clear");
  return out;
}

// Pick a move, see exactly what will be copied, copy it. Never runs anything.
const BOARD_PICK = {};                 // id -> chosen line, kept across refreshes
function boardFoot(it, moves){
  const foot = el("div","bfoot");
  const sel = el("select","bmove");
  sel.title = "which claim line to copy";
  for(const m of moves){ const o = txt("option",null, m.label); o.value = m.cmd; sel.appendChild(o); }
  const want = BOARD_PICK[it.id];
  sel.value = moves.some(m => m.cmd === want) ? want : moves[0].cmd;
  const code = txt("code","bcmd", sel.value);
  const btn = txt("button","bcopy","copy");
  btn.type = "button";
  btn.title = "copy, then run it in a terminal — the board is read-only";
  sel.addEventListener("change", () => { BOARD_PICK[it.id] = sel.value;
    code.textContent = sel.value; });
  btn.addEventListener("click", () => boardCopy(code.textContent, btn, code));
  foot.append(sel, btn, code);
  return foot;
}
function boardCopy(s, btn, code){
  const show = ok => {
    btn.textContent = ok ? "copied" : "press ⌘C / Ctrl+C";
    if(!ok) try { const r = document.createRange(); r.selectNodeContents(code);
      const w = window.getSelection(); w.removeAllRanges(); w.addRange(r); } catch(_){}
    setTimeout(() => { btn.textContent = "copy"; }, 1500);
  };
  const legacy = () => { let ok = false;
    try { const ta = el("textarea"); ta.value = s; ta.setAttribute("readonly", "");
      ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy");
      ta.remove(); } catch(_){}
    show(ok); };
  try { navigator.clipboard.writeText(s).then(() => show(true), legacy); }
  catch(_){ legacy(); }
}

function boardColumn(col, d){
  const box = el("section","bcol"+(col.flagged ? " flagged" : ""));
  box.dataset.lane = col.lane;
  const head = el("div","bhead");
  head.appendChild(txt("span","lane lg-"+(LANE_GROUP[col.lane] || "plan"), col.lane));
  head.appendChild(txt("span","bn", String(col.items.length)));
  box.appendChild(head);
  const many = col.lane === "done" && col.items.length > BOARD_DONE_SHOWN;
  const shown = many && !BOARD.allDone ? col.items.slice(0, BOARD_DONE_SHOWN) : col.items;
  for(const it of shown) box.appendChild(boardCard(it, d));
  if(!col.items.length) box.appendChild(txt("div","bempty","—"));
  if(many){
    const t = txt("span","lnk", BOARD.allDone ? "show last "+BOARD_DONE_SHOWN
      : "show all "+col.items.length);
    t.onclick = () => { BOARD.allDone = !BOARD.allDone;
      store.set("rm-board-alldone", BOARD.allDone); if(LAST) renderBoard(LAST); };
    box.appendChild(t);
  }
  return box;
}

function renderBoard(d){
  const pane = document.getElementById("board");
  const all = d.items || [];
  if(!all.length){
    pane.replaceChildren(txt("div","empty", d.error || "no roadmap items yet"));
    return;
  }

  const old = pane.querySelector(".board"), x = old ? old.scrollLeft : 0;
  const board = el("div","board");
  for(const col of boardColumns(items, FILT.lane)) board.appendChild(boardColumn(col, d));
  pane.replaceChildren(...(items.length ? [] : [txt("div","empty",
    QUERY ? "no items match “"+QUERY+"”" : "no items match the filters")]), board);

// Filter chips, shared by the list and the board through matches() and kept
// per browser in rm-filters. Lane is single-select and is the same state as
// the lane <select> (FILT.lane); the other groups are multi-select — OR within
// a group, AND across groups. "" stands for "no verdict" / "no branch".
const CHIP_GROUPS = ["lane","verdict","branch","type","version"];
const CHIP_NONE = {verdict:"no verdict", branch:"no branch"};
const chipVal = (it, g) => g === "lane" ? laneOf(it)
  : g === "verdict" ? ((it.claim && it.claim.verdict) || "")
  : g === "branch" ? ((it.branch && it.branch.name) || (it.claim && it.claim.branch) || "")
  : String(it[g] == null ? "" : it[g]);
const chipSel = g => g === "lane" ? (FILT.lane ? [FILT.lane] : [])
  : (Array.isArray(FILT[g]) ? FILT[g].filter(v => typeof v === "string") : []);
const chipsActive = () => CHIP_GROUPS.some(g => g !== "lane" && chipSel(g).length);
function chipMatch(it){
  return CHIP_GROUPS.every(g => g === "lane" || !chipSel(g).length
    || chipSel(g).includes(chipVal(it, g)));
}
function chipToggle(g, v){
  if(g === "lane") FILT.lane = FILT.lane === v ? "" : v;
  else { const s = chipSel(g); FILT[g] = s.includes(v) ? s.filter(x => x !== v) : [...s, v]; }
  saveFilt();
  if(LAST) render(LAST);
}
function chipOrder(g, vals){
  const lanes = [...BOARD_PIPE, ...BOARD_FLAGGED];
  const vk = v => String(v).split(".").map(n => parseInt(n,10) || 0);
  const by = {
    lane: (a,b) => (lanes.indexOf(a)+1 || 99) - (lanes.indexOf(b)+1 || 99) || (a < b ? -1 : 1),
    verdict: (a,b) => (a === "") - (b === "") || (a < b ? -1 : 1),
    version: (a,b) => { const A = vk(a), B = vk(b);
      for(let i = 0; i < Math.max(A.length, B.length); i++){
        const x = (B[i]||0) - (A[i]||0); if(x) return x; }
      return 0; },
  }[g] || ((a,b) => (a === "") - (b === "") || (a < b ? -1 : a > b ? 1 : 0));
  return vals.sort(by);
}
function syncChips(items){
  const box = document.getElementById("chips");
  const det = el("details","fchips");
  det.open = store.get("rm-chips-open", false) === true;
  det.addEventListener("toggle", () => store.set("rm-chips-open", det.open));
  const active = CHIP_GROUPS.reduce((a,g) => a + chipSel(g).length, 0);
  det.appendChild(txt("summary",null, "filter chips"+(active ? " · "+active+" on" : "")));
  for(const g of CHIP_GROUPS){
    const n = new Map();
    for(const it of items){ const v = chipVal(it, g); n.set(v, (n.get(v)||0) + 1); }
    for(const v of chipSel(g)) if(!n.has(v)) n.set(v, 0);   // keep a remembered pick
    if(!n.size) continue;
    const row = el("div","fgroup");
    row.appendChild(txt("span","fk", g));
    for(const v of chipOrder(g, [...n.keys()])){
      const on = chipSel(g).includes(v);
      const b = txt("button","fchip"+(on ? " on" : ""),
        (v === "" ? CHIP_NONE[g] || "none" : g === "version" ? "v"+v : v)+" "+n.get(v));
      b.type = "button";
      b.setAttribute("aria-pressed", on ? "true" : "false");
      b.addEventListener("click", () => chipToggle(g, v));
      row.appendChild(b);
    }
    det.appendChild(row);
  }
  if(active){
    const clr = txt("span","lnk","clear chips");
    clr.onclick = () => { FILT.lane = ""; for(const g of CHIP_GROUPS) if(g !== "lane") FILT[g] = [];
      saveFilt(); if(LAST) render(LAST); };
    det.appendChild(clr);
  }
  box.replaceChildren(det);
}

// Server-Sent Events: server pushes a fresh status on every .roadmap or
// branch-ref change. EventSource auto-reconnects on drop, so a closed
// terminal just goes stale-grey. A refresh re-renders whatever route is
// open, in place, keeping the route and the scroll position.
let es;
function connect(){
  es = new EventSource("/events");
  es.onmessage = ev => { try { LASTP = JSON.parse(ev.data);
    render(view(LASTP)); stale(false); refreshRoute(); } catch(_){} };
  es.onerror = () => stale(true);
}
document.getElementById("rootsel").addEventListener("change", e => {
  const v = e.target.value;
  VIEW = (v === "trunk" || v === "all") ? v : (parseInt(v, 10) || 0);
  if(LASTP) render(view(LASTP));   // view switch is local — no reconnect
  refreshRoute();                  // re-fetch the open pane/page for this root
});
// Relative ages ("3h ago") drift without new data; refresh them each minute.
setInterval(() => { if(LAST && ["roadmap","board"].includes(ROUTE.name)) render(LAST); }, 60000);

// ---- routes (plan 31) -------------------------------------------------
// Hash routes, so deep links and Back work without any server change:
//   #/  #/ideas  #/changelog          the three list tabs
//   #/board                           lane board (plan 37)
//   #/digest[/<since>]                what changed since 3h|1d|3d|1w|2w|last
//   #/plan/<id>  #/idea/<n>  #/notes/<root-relative .md path>   full pages
// The route lives only in the URL; nothing about it is stored.
const TABS = [["roadmap","Roadmap"],["board","Board"],["ideas","Ideas"],["changelog","Changelog"],
  ["digest","Digest"],
  ["versions","Versions"],["graph","Graph"]];   // plan 49 pages
const TABCOUNTS = {};
const LISTS = ["roadmap","board","ideas","changelog","digest"];
const DIGEST_SINCE = ["3h","1d","3d","1w","2w","last"];
const paneOf = t => document.getElementById(t==="roadmap" ? "app" : t);
const rootParam = () => "root=" + viewRoot(null);
let ROUTE = {name:"roadmap"};
let PREV_HASH = "";          // where a note page's "back" link goes
const SCROLL = {};           // list scroll positions, restored on return
try { history.scrollRestoration = "manual"; } catch(_){}

function parseRoute(h){
  const parts = String(h||"").replace(/^#\/?/, "").split("/");
  const head = parts[0] || "";
  if(head === "plan" && /^\d+$/.test(parts[1]||"")) return {name:"plan", id:+parts[1]};
  if(head === "idea" && /^\d+$/.test(parts[1]||"")) return {name:"idea", n:+parts[1]};
  if(head === "notes" && parts.length > 1){
    let p = parts.slice(1).join("/");
    try { p = decodeURIComponent(p); } catch(_){ return {name:"roadmap"}; }
    return {name:"notes", path:p};
  }
  if(head === "ideas" || head === "changelog" || head === "board") return {name:head};
  // plan 49: #/search/<q>
  if(head === "search"){
    let q = parts.slice(1).join("/");
    try { q = decodeURIComponent(q); } catch(_){ q = ""; }
    return {name:"search", q};
  }
  // plan 49: #/versions, #/version/<v>, #/graph
  if(head === "versions" || head === "graph") return {name:head};
  if(head === "version" && /^[\w.+-]{1,64}$/.test(parts[1]||""))
    return {name:"version", v:parts[1]};
  if(head === "digest")
    return {name:"digest", since: DIGEST_SINCE.includes(parts[1]) ? parts[1] : "1d"};
  return {name:"roadmap"};
}
const noteHref = p => "#/notes/" + encodeURIComponent(p).replace(/%2F/g, "/");
const tabOf = r => r.name === "plan" ? "roadmap" : r.name === "idea" ? "ideas"
  : LISTS.includes(r.name) ? r.name : NAV_TAB[r.name] || "";

// An in-app link: text only, and only an http(s) URL or a #/ route is ever
// assigned as href (anything else renders as plain text).
const SAFE_HREF = /^(https?:\/\/[^\s]+|#\/[^\s]*)$/i;
function link(href, text, cls){
  if(!SAFE_HREF.test(String(href||""))) return txt("span", cls||null, text);
  const a = txt("a", cls||null, text);
  a.href = href;
  if(/^https?:/i.test(href)){ a.target = "_blank"; a.rel = "noopener noreferrer"; }
  return a;
}

function renderTabs(){
  const cur = tabOf(ROUTE);
  document.getElementById("tabs").replaceChildren(...TABS.map(([id,label])=>{
    const a = el("a","tab"+(id===cur?" on":""));
    a.href = id === "roadmap" ? "#/" : "#/"+id;
    a.appendChild(document.createTextNode(label));
    if(TABCOUNTS[id] != null) a.appendChild(txt("span","n", TABCOUNTS[id]));
    return a;
  }), paletteTab());   // plan 49
}

function showPane(name){
  for(const id of [...LISTS, "page"])
    (id === "page" ? document.getElementById("page") : paneOf(id)).hidden = id !== name;
  // The search / lane / chip controls are shared by the list and the board.
  document.getElementById("rmctrls").hidden = name !== "roadmap" && name !== "board";
  document.body.classList.toggle("on-board", name === "board");   // plan 37
}

function onRoute(){
  const leaving = ROUTE;
  if(LISTS.includes(leaving.name)) SCROLL[leaving.name] = window.scrollY;
  ROUTE = parseRoute(location.hash);
  renderTabs();
  KSEL_IDX = -1;   // plan 49: j/k selection starts over on every route
  if(LISTS.includes(ROUTE.name)){
    showPane(ROUTE.name);
    if(FOCUS_SEARCH && ROUTE.name === "roadmap"){ FOCUS_SEARCH = false;
      document.getElementById("search").focus(); }
    if((ROUTE.name === "roadmap" || ROUTE.name === "board") && LAST) render(LAST);
    const y = SCROLL[ROUTE.name] || 0;
    const done = () => window.scrollTo(0, y);
    if(ROUTE.name === "ideas") loadIdeas(done);
    else if(ROUTE.name === "changelog") loadChangelog(done);
    else if(ROUTE.name === "digest") loadDigest(done);
    else done();
  } else {
    showPane("page");
    window.scrollTo(0, 0);
    renderPage(false);
  }
}
window.addEventListener("hashchange", () => {
  PREV_HASH = ROUTE.name === "notes" ? PREV_HASH : routeHash(ROUTE);
  onRoute();
});
function routeHash(r){
  return r.name === "plan" ? "#/plan/"+r.id : r.name === "idea" ? "#/idea/"+r.n
    : r.name === "notes" ? noteHref(r.path) : r.name === "roadmap" ? "#/"
    : r.name === "digest" ? "#/digest/"+r.since
    : r.name === "search" ? searchHref(r.q)
    : r.name === "version" ? "#/version/"+r.v : "#/"+r.name;
}

// Re-render the open route after an SSE payload or a view switch.
function refreshRoute(){
  if(ROUTE.name === "ideas") loadIdeas();
  else if(ROUTE.name === "changelog") loadChangelog();
  else if(ROUTE.name === "digest") loadDigest();
  else if(!LISTS.includes(ROUTE.name)) renderPage(true);
}

// Fetch → build off-DOM → swap in one go, then put the scroll back, so an
// SSE refresh never jumps the page. A stale response (route changed while
// in flight) is dropped.
let PAGE_SEQ = 0;
function renderPage(inPlace){
  const pane = document.getElementById("page");
  const seq = ++PAGE_SEQ, r = ROUTE;
  if(!inPlace) pane.replaceChildren(txt("div","empty","loading…"));
  // A deep link loads before the first SSE payload; which checkout to read
  // depends on it, so wait — connect()'s first message re-renders the route.
  if(!LASTP) return;
  // Never swap the page out from under someone typing in it (plan 49).
  if(inPlace && pane.contains(document.activeElement)
     && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  const build = r.name === "plan" ? planPage(r) : r.name === "idea" ? ideaPage(r)
    : r.name === "search" ? searchPage(r) : r.name === "version" ? versionPage(r)
    : r.name === "versions" ? versionsPage() : r.name === "graph" ? graphPage()
    : notePage(r);
  build.then(nodes => {
    if(seq !== PAGE_SEQ) return;
    const y = window.scrollY;
    pane.replaceChildren(...nodes);
    if(inPlace) window.scrollTo(0, y);
  }).catch(() => {
    if(seq === PAGE_SEQ && !inPlace)
      pane.replaceChildren(txt("div","empty","failed to load"));
  });
}

const getJSON = url => fetch(url, {cache:"no-store"}).then(r => r.json());

function crumb(backHref, backLabel, path){

  c.appendChild(link(backHref, "← "+backLabel));

function fact(box, key, ...vals){

  for(const x of vals) if(x) v.appendChild(typeof x === "string" ? txt("span",null,x) : x);
  if(!v.childNodes.length) return;
